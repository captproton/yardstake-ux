# The checks for buyer/3D that need no Blender (#139): the model index, the
# configurator page, its fixtures, the probe suite that proves each check
# still catches what it should, and the plan-set harvester's tests (#127). The
# checks use the standard library only; the harvester's tests also need
# poppler's pdftotext and PyYAML, installed in their own step.
#
# Not run here: the barn cabin's Blender gates and the byte-identical export
# check. They stay local; see buyer/3D/docs/PAGE-PLAN.md.
name: buyer/3D checks

on:
  pull_request:
    paths:
      - "buyer/3D/**"
      - ".github/workflows/buyer-3d-checks.yml"
  push:
    branches: [main]
    paths:
      - "buyer/3D/**"
      - ".github/workflows/buyer-3d-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buyer-3d-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: buyer/3D
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Each check is its own step, and every step runs even when an earlier
      # one failed, so one failure never hides another.
      - name: Index matches a fresh scan (build_index.py --check)
        run: python build_index.py --check

      - name: Index gates (verify_index.py)
        if: ${{ !cancelled() }}
        run: python verify_index.py

      - name: Page gates (verify_prototype.py)
        if: ${{ !cancelled() }}
        run: python verify_prototype.py

      - name: Fixtures match their generator (make_fixtures.py --check)
        if: ${{ !cancelled() }}
        run: python prototype/fixtures/make_fixtures.py --check

      - name: Probe suite (the Blender case skips without Blender)
        if: ${{ !cancelled() }}
        run: python probes/run_probes.py

      - name: Probe harness self-check
        if: ${{ !cancelled() }}
        run: python probes/run_probes.py --self-check

      # The harvester reads PDFs with pdftotext, and its known-answer test reads
      # the barn cabin's spec.yaml. Installed only for this step's needs.
      - name: Install pdftotext and PyYAML for the harvester tests
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet "PyYAML==6.0.2"

      - name: Plan-set harvester and spec-lint tests (adu_kit/test_sheets.py, test_spec_lint.py)
        if: ${{ !cancelled() }}
        run: python -m unittest adu_kit.test_sheets adu_kit.test_spec_lint -v

      # Every number in a model spec is cited, and every drawn length is on
      # the sheet it cites (#128).
      - name: Laurel spec lint (adu_kit/spec_lint.py)
        if: ${{ !cancelled() }}
        run: python -m adu_kit.spec_lint models/laurel_a1_460/spec.yaml --pdf "example plans/sacramento_adus/adu-plan-full-set-a1-laurel.pdf"

      # What the lint cannot see: positions that follow from their dimension
      # strings, and a frame that is not mirrored.
      - name: Laurel spec geometry (models/laurel_a1_460/verify_spec.py)
        if: ${{ !cancelled() }}
        run: python models/laurel_a1_460/verify_spec.py
