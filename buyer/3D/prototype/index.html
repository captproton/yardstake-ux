<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADU configurator</title>
<!--
  three.js is pinned HERE and nowhere else. app.js derives the matching Draco
  decoder path from THREE.REVISION, so a version bump is one edit to this map
  and verify_prototype.py fails if the two entries disagree or float.
-->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
<style>
  :root {
    color-scheme: light;
    --ink: #23211d;
    --muted: #6b675f;
    --paper: #f2f0eb;
    --line: #d6d2c9;
    --rail: 20rem;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  /* Header across the top; the viewer and its controls on the left; the
     option rail on the right; the estimate and quote across the foot. On a
     narrow screen they stack. */
  body {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "header header" "stage rail" "commerce commerce";
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
  }
  body:has(#rail[hidden]) {
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "header" "stage" "commerce";
  }
  header {
    grid-area: header;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.25rem 1rem;
    padding: 1rem 1.25rem 0.5rem;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  #model-facts { margin: 0; color: var(--muted); }
  #model-picker { margin-left: auto; font: inherit; }

  .stage {
    grid-area: stage;
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    min-height: 0;
  }
  main { position: relative; min-height: 0; }
  #viewer { position: absolute; inset: 0; }
  #viewer canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #viewer .labels { position: absolute; inset: 0; pointer-events: none; }
  .dimension-label {
    padding: 0.1rem 0.45rem;
    border-radius: 0.25rem;
    background: rgb(35 33 29 / 0.88);
    color: #fff;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #status {
    position: absolute;
    left: 50%;
    bottom: 1.25rem;
    transform: translateX(-50%);
    margin: 0;
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    background: rgb(255 255 255 / 0.85);
    color: var(--muted);
    white-space: nowrap;
  }

  /* The two controls under the viewer, as the reference page places them. */
  #controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1rem;
    padding: 0.75rem 1.25rem 1rem;
    border-top: 1px solid var(--line);
  }
  #controls[hidden] { display: none; }
  #view-modes { display: inline-flex; flex-wrap: wrap; gap: 0; }
  #controls button {
    font: inherit;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.45rem 0.8rem;
    border: 1px solid var(--ink);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  #view-modes button + button { border-left-width: 0; }
  #controls button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #controls button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #dimensions-legend {
    flex-basis: 100%;
    margin: 0;
    padding: 0;
    list-style: none;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #dimensions-legend strong { color: var(--ink); font-weight: 600; }

  /* The option rail. */
  #rail {
    grid-area: rail;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    padding: 1rem 1.25rem 0;
    border-left: 1px solid var(--line);
  }
  #rail[hidden] { display: none; }
  .rail-section h2 {
    margin: 0 0 0.75rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .rail-section + .rail-section { margin-top: 0.5rem; }
  #rail fieldset {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin: 0 0 1.1rem;
    padding: 0;
    border: 0;
    min-width: 0;
  }
  #rail legend {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    width: 100%;
    margin-bottom: 0.45rem;
    padding: 0;
    font-size: 0.9rem;
    font-weight: 600;
  }
  #rail legend .current { font-weight: 400; color: var(--muted); text-align: right; }
  .choice { position: relative; cursor: pointer; }
  .choice input {
    position: absolute;
    inset: 0;
    margin: 0;
    opacity: 0;
    cursor: pointer;
  }
  .swatches .choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25rem;
    width: 4rem;
    text-align: center;
    font-size: 0.72rem;
    line-height: 1.2;
    color: var(--muted);
  }
  .swatch {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 50%;
    border: 1px solid rgb(0 0 0 / 0.18);
  }
  .swatches input:checked + .swatch { outline: 2px solid var(--ink); outline-offset: 2px; }
  .swatches input:checked ~ .choice-label { color: var(--ink); }
  .swatches input:focus-visible + .swatch { outline: 2px dashed var(--ink); outline-offset: 3px; }
  .layouts .choice-label {
    display: inline-block;
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--ink);
    font-size: 0.8rem;
  }
  .layouts input:checked + .choice-label { background: var(--ink); color: var(--paper); }
  .layouts input:focus-visible + .choice-label { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Required copy: pinned to the rail's foot, so it stays in view. */
  .disclosure {
    position: sticky;
    bottom: 0;
    margin: auto -1.25rem 0;
    padding: 0.75rem 1.25rem 1rem;
    border-top: 1px solid var(--line);
    background: var(--paper);
    font-size: 0.8rem;
  }

  /* The commerce slots (#112): whatever the host supplies, and the quote. */
  #commerce {
    grid-area: commerce;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 1.5rem;
    padding: 0.75rem 1.25rem;
    border-top: 1px solid var(--line);
  }
  #commerce[hidden] { display: none; }
  #estimate { display: grid; gap: 0.1rem; }
  /* A display rule outranks the hidden attribute; without this the heading
     shows over no estimate at all. */
  #estimate[hidden] { display: none; }
  .estimate-heading {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #estimate-list { color: var(--muted); font-size: 0.85rem; }
  #estimate-range { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  #estimate-note, #estimate-updating { color: var(--muted); font-size: 0.8rem; }
  .quote-disclosure { flex: 1 1 16rem; margin: 0; font-size: 0.8rem; }
  #quote {
    margin-left: auto;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.7rem 1.4rem;
    border: 0;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
  }
  #quote:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  #quote-dialog {
    width: min(32rem, calc(100vw - 2rem));
    padding: 1.25rem;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
  }
  #quote-dialog::backdrop { background: rgb(35 33 29 / 0.4); }
  #quote-dialog h2 { margin: 0 0 0.75rem; font-size: 1.1rem; }
  #quote-summary { display: grid; grid-template-columns: auto 1fr; gap: 0.25rem 1rem; margin: 0 0 0.75rem; }
  #quote-summary dt { color: var(--muted); }
  #quote-summary dd { margin: 0; }
  #quote-dialog p { margin: 0 0 0.75rem; font-size: 0.85rem; }
  #quote-json { max-height: 12rem; overflow: auto; padding: 0.5rem; background: #fff; font-size: 0.75rem; }
  #quote-dialog form { text-align: right; }

  @media (max-width: 800px) {
    html, body { height: auto; }
    body,
    body:has(#rail[hidden]) {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto auto auto;
      grid-template-areas: "header" "stage" "rail" "commerce";
    }
    .stage { height: 70vh; }
    #rail { overflow: visible; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1 id="model-name">&nbsp;</h1>
  <p id="model-facts"></p>
  <select id="model-picker" aria-label="Model" hidden></select>
</header>
<div class="stage">
  <main>
    <div id="viewer" aria-label="3D model viewer"></div>
    <p id="status" role="status">Loading…</p>
  </main>
  <footer id="controls" hidden>
    <div id="view-modes" role="group" aria-label="View" hidden></div>
    <button id="dimensions-toggle" type="button" aria-pressed="false" hidden>Show dimensions</button>
    <ul id="dimensions-legend" aria-label="Footprints" hidden></ul>
  </footer>
</div>
<aside id="rail" aria-label="Options" hidden></aside>
<!--
  The commerce slots (#112). The page prices nothing: a host renders an
  estimate as <script type="application/json" id="commerce-data"> or sends
  one as an adu:estimate event, and receives adu:quote. docs/COMMERCE.md.
-->
<footer id="commerce" aria-label="Estimate and quote" hidden>
  <div id="estimate" role="status" hidden>
    <span class="estimate-heading">Project cost estimate</span>
    <s id="estimate-list" hidden></s>
    <strong id="estimate-range" hidden></strong>
    <span id="estimate-note" hidden></span>
    <span id="estimate-updating" hidden>Updating the estimate for your choices…</span>
  </div>
  <p id="quote-disclosure" class="quote-disclosure" hidden></p>
  <button id="quote" type="button">Get your quote</button>
</footer>
<dialog id="quote-dialog" aria-labelledby="quote-title">
  <h2 id="quote-title">Your configuration</h2>
  <dl id="quote-summary"></dl>
  <p id="quote-estimate" hidden></p>
  <p id="quote-dialog-disclosure" hidden></p>
  <p>No quote service is connected to this page, so nothing was sent. This is the configuration a quote would carry:</p>
  <pre id="quote-json"></pre>
  <form method="dialog"><button type="submit">Close</button></form>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
