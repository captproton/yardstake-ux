      from_ft: 11.2917
      to_ft: 14.6667
      derived: 'three strings end on this face, and agree: 11.4583 - 7''-3" = 4.2083, the rear wall''s inside face 0.4583 + 3''-9" = 4.2083, and 7.375 -
