discrepancies:
- id: the-plan-set-does-not-draw-the-ceiling
  impact: No reflected ceiling plan, building section or truss profile is in the set, so the form of the ceiling (flat at the plate, scissor, or partly
    vaulted) cannot be read. The truss profile is a deferred submittal (structural note 14).
  resolution: 'ASSUMED FLAT AT T.P. 8''-0" (roof.ceiling.settled: false). The evidence for it is the attic-access note, the attic-access hatch on A-1.0
    and the ventilation calculation, and none of it is a drawing of the ceiling.'
  source: A-2.0 ROOF PLAN NOTES; A-1.0 floor plan; structural notes page 12 note 14
- id: the-window-b-string-is-a-rough-opening
  impact: A-1.0's front-wall string gives 1'-7" for window B; the window schedule gives B a width of 1'-6".
  resolution: 'THE SCHEDULE''S 1''-6" is the window, the string''s 1''-7" the rough opening (the same 1" frame the other windows'' strings do not show).
    The spec carries BOTH spans on W-B1: x0/x1 is the 1''-7" rough opening the wall is cut to, and unit_x0/unit_x1 is the 1''-6" window, centred in it (an
    assumption: no sheet places it).'
  source: A-1.0 floor plan front-wall string; A-1.0 Window Schedule mark B
- id: the-porch-junction-is-derived-not-dimensioned
  impact: Where the porch roof meets the main roof is drawn but not dimensioned. The valley meeting point is about 5.1 ft in from the front wall on the
    roof plan.
  resolution: NOT RECONCILED HERE, ON PURPOSE. The only machine-readable value is the derivation (roof.porch.junction_depth, 5.6333 ft); the roof plan's
    ink reads about 5.1 ft, and the 0.5 ft between them is within what the unexplained 10.8" of heel and the sheet's drafting tolerance could account for.
    The Willow build (#172) and its overlay (#173) decide which governs, with the roof built and measured; neither number is dimensioned on a sheet.
  source: A-2.0 ROOF PLAN and FRONT ELEVATION
