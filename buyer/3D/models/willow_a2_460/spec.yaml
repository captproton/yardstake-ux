        this wall''s far face, and its 3 1/2" studs put the near face at 14.6667 + 0.2917 = 14.9583. The choice of face is carried from Laurel''s layout;
        verify_spec.py holds the far face to Willow''s 9''-4". It spans from the rear wall''s interior face (0.4583) to P_block_W at Y 11.4583, and carries
        door 5.'
