      runs_along: X
      at_ft: 11.4583
      studs_toward: -Y
      from_ft: 11.2917
      to_ft: 17.4583
      derived: 'the 5''-2" string, whose ticks run from P_bath_W''s kitchen face: 6.2917 + 5.1667 = 11.4583, this wall''s living-room face; its studs run
        to Y 11.1667. The 7''-3" string lands here too, from P_laundry_E. It spans the whole block depth, from P_block_S at X 11.2917 to P_pantry_N at X
