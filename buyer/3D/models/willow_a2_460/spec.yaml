# Willow -- dimensional spec (A1, drafted 2026-10-02; PR #179, issue #171)
# Source plan set: adu-plan-full-set-a2-willow.pdf
#
# EVERY NUMBER IS CITED. `source` names a sheet listed in sheet_index and where on
# it; `derived` shows the arithmetic; `assumed` says why no sheet says it.
# adu_kit/spec_lint.py fails any number without one, and verify_spec.py checks what
# the numbers mean together. What is CARRIED or ASSUMED rather than read from
# Willow's own sheets is marked `assumed` or described in the block's `status`; the
# interior layout is carried from Laurel (see interior_partitions).
# Read models/laurel_a1_460/spec.yaml for the shape; its keys are what adu_kit and
# the page read.

meta:
  model_id: willow_a2_460
  option: studio
  display_name: Willow
  index:
    area_key: studio_sf
    storeys:
      count: 1
      loft: false
      raw: single storey, no loft
      source: 'A-2.0 front, rear and side elevations: one floor, F.F. to T.P. only; A-1.0 draws one floor'
    note: 'Sacramento County Permit Ready ADU, Model A2 "Willow": the studio plan, 460 sf, a truss gable roof and a stick-framed gable roof over a covered
      porch on the front wall. The exterior is stucco or fibre-cement lap siding, chosen on the page.'
    front:
      glb: -z
      entry: Leaf_D-1
      source: A-2.0 FRONT ELEVATION draws entry door 1 on the front wall, under the porch roof; A-1.0 puts door 1 in the Y 19'-2" wall. Built at Blender
        +Y (frame.front).
  front:
    end: +Y, the 24'-0" wall with entry door 1 and the covered porch
    note: The fact the manifest declares. Not published by this spec.
    source: A-1.0 floor plan, door 1 and the 122 S.F. COVERED PORCH on the plan's left wall; A-2.0 FRONT ELEVATION shows door 1 under the porch roof
  plan_date: MAR 2024
  plan_date_note: A-0.0, A-1.0 and A-2.0 title blocks say MAR 2024 and give no day
  designer: Laura Miller Design, El Dorado Hills CA; structural engineer in Rocklin CA
  code_basis: 2022 California Residential Code
  source_pdf_pages:
    count: 20
    derived: pdfinfo reports 20 pages
option_selection:
  chosen: studio
  reason: 'A-1.0 draws two plans. "1 MODEL A2 FLOOR PLAN" is the whole building as a studio, fully dimensioned, with both schedules. "2 1 BEDROOM FLOOR
    PLAN OPTION" is a partial plan of the rear half only: a partition, pocket door 7 and an egress window. The studio is the complete drawing, so it is
    built; the one-bedroom plan is a future configurator choice, not a second model. This is the choice Laurel made for the same reason.'
  decided: 2026-10-02, by the project owner (the factory plan's Willow decision), carried from Laurel's option_selection
  source: A-1.0 drawings 1 MODEL A2 FLOOR PLAN and 2 1 BEDROOM FLOOR PLAN OPTION; A-1.0 LIGHT & VENTILATION CALCULATIONS list STUDIO and OPTIONAL BEDROOM
    1
