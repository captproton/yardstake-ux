  - A-2.0
frame:
  handedness: right
  up: +Z
  front: +Y
  x_increases: to the viewer's left, facing the front wall from outside
  x_zero_end: 'living room: grid B on A-1.0, the six D windows, the SIDE (RIGHT) ELEVATION'
  x_max_end: 'kitchen and bath: grid A on A-1.0, windows C and F, the SIDE (LEFT) ELEVATION'
  evidence:
  - SIDE (LEFT) ELEVATION draws windows C and F with the front (the porch roof) on the viewer's RIGHT. Facing an end wall from outside with the front on
    your right means looking toward -X, so C and F are on the X-max end.
  - 'SIDE (RIGHT) ELEVATION draws the six D windows with the front (the porch roof) on the viewer''s LEFT: looking toward +X, so the D windows are on the
    X-zero end.'
  - REAR ELEVATION draws window E and door 6 on the viewer's left and the electrical panel and condenser on its right; facing the rear wall from outside,
    the viewer's right is toward X-max, so E and door 6 are on the X-zero side. A-1.0 puts them there.
  - FRONT ELEVATION draws window B (the narrow tall sidelite) on the viewer's left of door 1; facing the front wall from outside, the viewer's left is toward
    X-max, which is the grid A side where A-1.0 draws it.
  source: A-2.0 SIDE (LEFT), SIDE (RIGHT), FRONT and REAR ELEVATIONS; A-1.0 floor plan. The plan is laid out as Laurel's A-1.0 is, so the frame is Laurel's.
envelope:
  width:
    ft: 24.0
    raw: 24'-0"
    axis: X
    source: A-1.0 floor plan, overall string on the front (left) wall
  depth:
    ft: 19.1667
    raw: 19'-2"
    axis: Y
    source: A-1.0 floor plan, overall string along the bottom (grid B) wall
  front_to_grid_2:
    ft: 13.1667
    raw: 13'-2"
    source: A-1.0 floor plan, top string, grid 1 to grid 2
  grid_2_to_rear:
    ft: 6.0
    raw: 6'-0"
    source: A-1.0 floor plan, top string, grid 2 to grid 3
  area_check:
    value_sf: 460.0
    derived: 24 x 19 1/6 (19'-2") = 460 exactly, the declared 460 S.F. (areas_declared.studio_sf)
  grid_check:
    ft: 19.1667
    derived: 13'-2" + 6'-0" = 19'-2", the overall depth
areas_declared:
  studio_sf:
    value: 460
    source: 'A-0.0 project data ''S.F. OF PROPOSED ADU''; A-1.0 LIGHT & VENTILATION ''STUDIO: 460 S.F.''; A-2.0 ROOF PLAN NOTES ''ENCLOSED RAFTER AREA:
      460 S.F.'''
  optional_bedroom_sf:
    value: 108
    source: 'A-1.0 LIGHT & VENTILATION ''OPTIONAL BEDROOM 1: 108 S.F.'''
    note: 1 bedroom option only
  covered_porch_sf:
    value: 122
    source: A-1.0 floor plan '122 S.F. COVERED PORCH'
    note: Outside the 460 sf, and a separate line on A-0.0's project data. It is the porch under the stick-framed roof, not a second plan option.
levels:
  datum: finished_floor
  finished_floor:
    ft: 0.0
    raw: 0'-0"
    source: A-2.0 all four elevations, F.F. 0'-0"
  grade:
    ft: -0.5
    raw: -0'-6"
    source: A-2.0 all four elevations, GRADE -0'-6"
    note: Grade is 6" below the floor, as Laurel's.
  top_of_plate:
    ft: 8.0
    raw: 8'-0"
    label: T.P.
    source: A-2.0 FRONT, REAR, SIDE (LEFT) and SIDE (RIGHT) ELEVATIONS and ROOF PLAN, T.P. 8'-0" on every one
    note: 'ONE plate height on all four walls: Willow has no T.P. 1 / T.P. 2 pair as Laurel does.'
  top_of_roof:
    ft: 12.8958
    raw: 12'-10 3/4"
    source: A-2.0 REAR ELEVATION, 12'-10 3/4" TOP OF ROOF
    note: The main gable's ridge, to the top of the roof, from F.F.
roof:
  form: two_gables
  settled: TWO ROOFS, NOT ONE. A truss gable at 5"/1'-0" over the building, ridge along the 24'-0" direction (parallel to the front wall), and a stick-framed
    gable at 3"/1'-0" over the covered porch on the front wall, its ridge running front to rear and meeting the main roof's front slope. The FRONT ELEVATION
    shows the porch gable end with a 6X6 PT KING POST, two 6X6 PT POSTS and a 6X10 PT BEAM; the SIDE ELEVATIONS show the main gable end and the porch roof
    as a lower stick-framed roof against it; the ROOF PLAN shows both, joined by two valleys. Preflight (WILLOW-PREFLIGHT.md) read the same.
  source: A-2.0 FRONT, SIDE (RIGHT) and SIDE (LEFT) ELEVATIONS and ROOF PLAN; A-0.0 scope of work 'STICK FRAMED AND TRUSS ROOF'
  main:
    form: gable
    framing: pre-manufactured trusses @ 24" o.c.
    ridge_runs_along: X
    ridge_at_y:
      ft: 9.5833
      derived: 'half the 19''-2" depth: the gable is drawn symmetric about the building (the SIDE ELEVATIONS'' apex sits at mid-depth)'
      assumed: symmetric trusses; the truss profile is not in the set (see ceiling)
    slope:
      rise_in: 5
      run_in: 12
      raw: 5" / 1'-0"
      source: A-2.0 ROOF PLAN slope arrow; A-2.0 SIDE (RIGHT) and SIDE (LEFT) ELEVATIONS slope arrows
    overhangs:
      rear_eave:
        ft: 1.5
        raw: 1'-6"
        source: A-2.0 ROOF PLAN, 1'-6" (OVERHANG) at the rear edge
      front_eave:
        ft: 1.5
        assumed: equal to the rear eave. The ROOF PLAN labels no front eave on the main roof (the porch roof hides it); the SIDE ELEVATIONS draw both main
          eaves the same length, measured about 1.46 ft on the sheet at its stated 1/4" = 1'-0".
      rakes:
        ft: 1.0
        raw: 1'-0"
        source: A-2.0 ROOF PLAN, 1'-0" (OVERHANG) at both 24'-0" ends
    ridge_vent_length:
      ft: 24.25
      raw: 24'-3"
      source: A-2.0 ROOF PLAN NOTES, 24'-3" (24.25') LINEAR FEET OF RIDGE VENT
  porch:
    form: gable
    framing: stick framed
    ridge_runs_along: Y
    slope:
      rise_in: 3
      run_in: 12
      raw: 3" / 1'-0"
      source: A-2.0 FRONT ELEVATION slope arrows, both sides of the porch gable
    projects:
      ft: 5.0
      raw: 5'-0"
      source: A-2.0 ROOF PLAN, 5'-0" (OVERHANG) at the front edge
    side_eaves:
      ft: 1.0
      raw: 1'-0"
      source: A-2.0 ROOF PLAN, 1'-0" (OVERHANG) at both 24'-0" ends; the FRONT ELEVATION draws the porch roof the same width as the main roof
    supports: 6X10 PT beam on 6X6 PT posts, 6X6 PT king post in the gable
    supports_source: A-2.0 FRONT ELEVATION labels; A-1.0 floor plan draws four posts at the porch's front edge
    posts:
      count: 4
      source: A-1.0 floor plan, four square post marks at the porch's edge; A-2.0 ROOF PLAN, WOOD POSTS BELOW at the same four
      size: 6X6 PT
      size_source: A-2.0 FRONT ELEVATION labels '6X6 PT POST' and '6X6 PT POSTS'
      spacing:
        strings:
        - 8'-4 1/4"
        - 7'-3 1/2"
        - 8'-4 1/4"
        source: A-2.0 ROOF PLAN, the three strings beside the WOOD POSTS BELOW marks, from the grid A end
        check:
          ft: 24.0
          derived: '8''-4 1/4" + 7''-3 1/2" + 8''-4 1/4" = 24''-0", the front wall: a post at each end of it and two between'
      x:
        ft:
        - 24.0
        - 15.6458
        - 8.3542
        - 0.0
        derived: 'from grid A (X 24), minus each spacing in turn: 24 - 8''-4 1/4" = 15.6458, less 7''-3 1/2" = 8.3542, less 8''-4 1/4" = 0'
      setback_from_front_wall:
        ft: 4.375
        raw: 4'-4 1/2"
        source: A-1.0 floor plan, the string from the front wall to the post line, beside the covered porch
      setback_note: to the posts' centre line, from the wall's outside face; A-1.0 draws the post marks at that line
      beam:
        size: 6X10 PT
        runs_along: X
        source: A-2.0 FRONT ELEVATION label '6X10 PT BEAM'
        top:
          ft: 8.0
          derived: the porch roof's eave line is the plate line, T.P. 8'-0" (A-2.0 FRONT ELEVATION draws the beam under it)
          assumed: no sheet dimensions the beam's height; it is read from where the elevation draws it against T.P.
      king_post:
        size: 6X6 PT
        at_x:
          ft: 12.0
          derived: the middle of the 24'-0" front wall; the elevation draws it on the porch gable's ridge
        source: A-2.0 FRONT ELEVATION label '6X6 PT KING POST'
    spans: the full 24'-0" front wall plus the 1'-0" side eaves, 26'-0"
    junction_depth:
      ft: 5.6333
      derived: 'the porch ridge stands 13 ft (half of 26''-0") x 3/12 = 3.25 ft above T.P.; the main roof''s top is 4.8958 ft above T.P. at mid-depth and
        falls 5/12 per ft toward the front wall, so it is 3.25 ft high (4.8958 - 3.25) x 12/5 = 3.95 ft before the front wall''s depth of 9.5833: 9.5833
        - 3.95 = 5.6333 ft in from the front wall'
    meets_main_roof: 'along two valleys. The porch ridge is level at T.P. plus half the 26''-0" span at 3"/1''-0" (3.25 ft), and it meets the main roof''s
      front slope where that slope is as high: about 5.6 ft in from the front wall. The ROOF PLAN draws the valley meeting point about 5.1 ft in. Derived,
      not dimensioned: no sheet gives the junction.'
  heel:
    derived: top of roof 12'-10 3/4" less T.P. 8'-0" = 4.8958 ft (58.75"); a 5:12 slope over half of 19'-2" (9'-7") rises 3.9931 ft (47.9"). The remaining
      0.9028 ft (10.8") is the truss heel and the roofing, and no sheet dimensions it.
    unexplained_in: 10.8
    assumed: the 10.8" is split between a raised heel and the roof's thickness; the build must not guess it, so the truss profile (a deferred submittal)
      settles it
  ceiling:
    settled: false
    form: flat
    at:
      ft: 8.0
      raw: 8'-0"
      source: A-2.0 elevations T.P. 8'-0"
    assumed: 'A FLAT CEILING AT THE PLATE, BUT THE PLAN SET DOES NOT DRAW IT. Evidence for it: A-2.0''s attic-access note measures head height from the
      top of the ceiling framing members to the underside of the roof framing; A-1.0 draws a MIN. 22X30 ATTIC ACCESS hatch in the plan; A-2.0''s roof ventilation
      is computed for an enclosed rafter area of the whole 460 S.F.; no A-1.0 room is tagged ''CEILINGS FOLLOW ROOF LINE'' as Laurel''s living room is.
      What it does not show: a reflected ceiling plan, a building section or a truss profile. Note 14 of the truss notes on the structural notes sheet (page
      12) says the TRUSS MANUFACTURER PROVIDES THE TRUSS PROFILE, so the profile is a deferred submittal and is NOT in this set.'
    what_would_settle_it: the truss manufacturer's profile or a building section; neither is in the plan set, so this stays an assumption for this model.
    source: A-2.0 ROOF PLAN NOTES (attic access, ventilation); A-1.0 floor plan (attic access hatch); structural notes page 12, truss note 14
  roofing:
    material: asphalt_shingle
    source: A-2.0 ROOF PLAN NOTES 'ROOFING MATERIAL TO BE ASPHALT SHINGLE'; A-0.0 'COMPOSITE SHINGLES'
  gutter:
    style: seamless box gutter, downspouts at the porch corners
    source: A-2.0 ROOF PLAN notes 'SEAMLESS BOX STYLE GUTTER', DOWNSPOUT leaders
construction:
  dimensions_to: face of stud
  dimensions_to_source: A-1.0 floor plan note 'ALL DIMENSIONS TO FACE OF STUD U.N.O.'
  exterior_wall:
    framing: 2x6 exterior walls, bearing
    source: A-1.0 WALL LEGEND '2X6 EXTERIOR WALL'; A-0.0 scope of work '2X6 EXTERIOR WALLS'
    stud_depth:
      ft: 0.4583
      raw: 5 1/2"
      assumed: the actual depth of a 2x6; A-3.0 and A-3.2 draw the stud but dimension none of the layers
    interior_finish:
      ft: 0.0417
      raw: 1/2"
      material: gypsum_board
      source: A-3.0 detail 1 STUCCO WALL SECTION '1/2" GWB'; A-3.2 detail 1
    cladding_options:
    - id: stucco
      layers:
      - sheathing per structural
      - WRB
      - self furring lath
      - 3 coat cement plaster
      source: A-3.0 detail 1 STUCCO WALL SECTION
    - id: fiber_cement_lap_siding
      layers:
      - sheathing per structural
      - WRB
      - fiber cement lap siding
      source: A-3.2 detail 1 LAP SIDING WALL SECTION; A-3.2 LAP SIDING NOTES
    sheathing:
      ft: 0.0313
      raw: 3/8"
      source: S1.0 SHEARWALL SCHEDULE, '3/8" APA RATED ONE FACE' (read on Willow's own S1.0, 2026-10-02); A-3.0 and A-3.2 say 'SHEATHING PER STRUCTURAL'
      note: The schedule governs shear walls; the wall sections say only 'per structural'. The build models one wall type, so the schedule's thickness is
        applied to every exterior wall (Laurel's reading, here checked against Willow's sheet).
    cladding_modelled:
      ft: 0.0
      assumed: 'ZERO, ON PURPOSE. Neither A-3.0 (stucco) nor A-3.2 (lap siding) dimensions its cladding, and the two are not the same thickness in any real
        assembly: three-coat cement plaster over self-furring lath runs about 7/8", fiber cement lap siding about 5/16" over its sheathing. Modelling each
        at its own thickness would move the outer faces of the building when the finish changed, and variants .exterior_finish records that change as a
        FINISH SWAP, not a geometry change -- the page swaps a baseColorFactor in the manifest (#131, #133), not a mesh. So the build stops the geometry
        at the sheathing face and carries the cladding as a material only. The error is at most seven eighths of an inch on a 24-foot building, below what
        the page can show at the distance a homeowner views it, and the overall dimensions this model publishes stay the ones A-1.0 draws.

        '
      revisit: '#131 and #133, if the configurator ever needs the two finishes to differ in section'
    outer_face:
      derived: 'face of stud + construction.exterior_wall.sheathing. The envelope dimensions are to face of stud (A-1.0 U.N.O.), so the modelled exterior
        surface sits 3/8" outboard of X 0, X 24, Y 0 and Y 19.1667.

        '
      note: '#130''s elevation overlay compares this face against A-2.0'
    casing_reveal:
      ft: 0.0313
      raw: 3/8"
      source: A-3.0 details 3 and 4, 0'-0 3/8" at the metal casing bead
  interior_wall:
    framing: 2x4, gyp board both sides
    source: 'A-1.0 WALL LEGEND ''2X4 INTERIOR WALL: GYP. BOARD BOTH SIDES'''
    stud_depth:
      ft: 0.2917
      raw: 3 1/2"
      assumed: the actual depth of a 2x4; not dimensioned on any sheet
    interior_finish:
      ft: 0.0417
      raw: 1/2"
      material: gypsum_board
      assumed: 'A-1.0''s legend says GYP. BOARD BOTH SIDES and gives no thickness; the 1/2" A-3.0 and A-3.2 call for on the exterior walls'' inside face.
        The fixtures'' measured backs agree: each sits 0.040-0.041 ft off a stud face'
  foundation:
    type: slab_on_grade
    source: 'A-0.0 project data ''FOUNDATION: SLAB''; scope of work ''SLAB ON GRADE FOUNDATION'''
    slab:
      thickness:
        ft: 0.3333
        raw: 4"
        source: 'S1.0 FOUNDATION AND SHEARWALL PLAN, ''4" CONC. SLAB ON GRADE W/ #3 BARS'' (read on Willow''s own S1.0, 2026-10-02)'
