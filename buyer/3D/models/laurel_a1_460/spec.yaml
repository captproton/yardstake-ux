# Laurel A1 460sf ADU — dimensional spec (P1, #128)
# Source plan set: buyer/3D/example plans/sacramento_adus/adu-plan-full-set-a1-laurel.pdf
#   Sacramento County Permit Ready ADU, Model A1 "Laurel". Laura Miller Design,
#   El Dorado Hills CA; architectural sheets dated MAR 2024, structural (WCD
#   Associates) 4/15/2024. 20 pages. 2022 California Residential Code.
#
# AUTHORITY RULE: A-1.0 (floor plan, schedules) and A-2.0 (roof plan,
# elevations) are the geometry authority. A-3.x governs assembly layers only;
# S1.0 governs structure; T24 carries no geometry. The designer's rendering is
# appearance evidence and never geometry.
#
# EVERY NUMBER IS CITED. `source` names a sheet listed in sheet_index and where
# on it; `derived` shows the arithmetic; `assumed` says why nothing on a sheet
# says it. adu_kit/spec_lint.py fails any number without one, and requires
# every drawn length (a length with a foot mark, wherever it appears) to cite
# a sheet and to be a dimension adu_kit/sheets.py harvests from it. This
# model's verify_spec.py checks that the positions follow from their
# dimension strings and that the frame is not mirrored.
#
# UNITS: decimal FEET unless the key says otherwise, to 4 places. `raw` is the
#        string as drawn.
#
# FRAME: right-handed, Z up, the front (entry) wall facing +Y.
#   X  0 .. 24.0     the front wall's length. X 0 is the living room end (grid
#                    line B on A-1.0, the SIDE (RIGHT) ELEVATION); X 24 is the
#                    kitchen and bath end (grid line A, the SIDE (LEFT) ELEVATION)
#   Y  0 .. 19.1667  rear wall face .. front (entry) wall face
#   Z  0 = finished floor (F.F. 0'-0" on every A-2.0 elevation)
# Facing the front wall from outside, X increases to YOUR LEFT. On A-1.0 the
# front wall is the plan's left edge, so plan-up is +X and plan-right is -Y: a
# rotation of the sheet, not a mirror. `frame` below gives the evidence; the
# first draft of this spec had it mirrored (see discrepancies).
# A-1.0: "ALL DIMENSIONS TO FACE OF STUD U.N.O." Overall dimensions are read
# as the outside face of the exterior studs; cladding sits outboard of them.

meta:
  model_id: laurel_a1_460
  option: studio                   # see option_selection
  display_name: "Laurel"
  index:
    area_key: studio_sf
    storeys: {count: 1, loft: false, raw: "single storey, no loft",
              source: "A-2.0 front, rear and side elevations: one floor, F.F. to T.P. only"}
    thumbnail_note: "no renders yet; the export (#131) makes them"
  front:
    end: "+Y, the 24'-0\" wall with entry door 1"
    note: "The fact #117 declares in the manifest. Not published by this spec."
    source: "A-1.0 floor plan, door 1 on the plan's left wall; A-2.0 FRONT ELEVATION shows door 1 with windows A and B each side"
  plan_date: "MAR 2024"
  plan_date_note: "A-0.0 and A-1.0 title blocks say MAR 2024 and give no day; S1.0 is dated 4/15/2024"
  designer: "Laura Miller Design, El Dorado Hills CA; structural by WCD Associates, Rocklin CA"
  code_basis: "2022 California Residential Code"
  source_pdf_pages: {count: 20, derived: "pdfinfo reports 20 pages. A-0.0's SHEET INDEX lists only 17 sheet ids; pages 13, 15 and 16 are not in it (see discrepancies)"}

# ---------------------------------------------------------------------------
option_selection:
  chosen: studio
  reason: >
    A-1.0 draws two plans. "1 FLOOR PLAN" is the whole building as a studio,
    fully dimensioned, with both schedules. "2 1 BEDROOM FLOOR PLAN OPTION" is a
    partial plan of the rear half only: a partition, pocket door 7 and an
    operable window C. The studio is the complete drawing, so it is built. The
    one-bedroom plan is recorded under `variants.floor_plan_options` as a future
    configurator choice, not a second model.
  decided: "2026-09-14, by the project owner"
  source: "A-1.0 drawings 1 FLOOR PLAN and 2 1 BEDROOM FLOOR PLAN OPTION; A-1.0 LIGHT & VENTILATION CALCULATIONS list STUDIO and OPTIONAL BEDROOM 1"

# ---------------------------------------------------------------------------
sheet_index:
  source: "A-0.0 SHEET INDEX for ids and titles; each page's title block for its id"
  sheets:
  - {pdf_page: 1,  id: A-0.0, title: "Title sheet"}
  - {pdf_page: 2,  id: A-0.1, title: "CALGreen checklist"}
  - {pdf_page: 3,  id: A-0.2, title: "CALGreen checklist (cont)"}
  - {pdf_page: 4,  id: A-1.0, title: "Floor plan, door and window schedules, 1 bedroom option"}
  - {pdf_page: 5,  id: A-1.1, title: "Power plan"}
  - {pdf_page: 6,  id: A-2.0, title: "Roof plan and exterior elevations, roof section, window detail key"}
  - {pdf_page: 7,  id: A-3.0, title: "Stucco section details"}
  - {pdf_page: 8,  id: A-3.1, title: "Stucco plan details"}
  - {pdf_page: 9,  id: A-3.2, title: "Lap siding section details"}
  - {pdf_page: 10, id: A-3.3, title: "Lap siding plan details"}
  - {pdf_page: 11, id: A-3.4, title: "Awning details"}
  - {pdf_page: 12, id: A-3.5, title: "Fire details"}
  - {pdf_page: 13, id: null,  title: "Structural specifications", note: "portrait; no id read from its title block"}
  - {pdf_page: 14, id: S1.0,  title: "Foundation, shearwall and roof framing plans"}
  - {pdf_page: 15, id: SD1,   title: "Structural details"}
  - {pdf_page: 16, id: SD2,   title: "Structural details"}
  - {pdf_page: 17, id: T24-1, title: "Title 24 energy"}
  - {pdf_page: 18, id: T24-2, title: "Title 24 energy"}
  - {pdf_page: 19, id: T24-3, title: "Title 24 energy"}
  - {pdf_page: 20, id: T24-4, title: "Title 24 energy"}
  geometry_authority: [A-1.0, A-2.0]

# ---------------------------------------------------------------------------
frame:
  handedness: right
  up: "+Z"
  front: "+Y"
  x_increases: "to the viewer's left, facing the front wall from outside"
  x_zero_end: "living room: grid B on A-1.0, windows C1 and C2, the SIDE (RIGHT) ELEVATION"
  x_max_end: "kitchen and bath: grid A on A-1.0, windows D and E, the SIDE (LEFT) ELEVATION"
  evidence:
  - "SIDE (LEFT) ELEVATION draws windows D and E with the front (the high eave and the canopy) on the viewer's RIGHT. Facing an end wall from outside with the front on your right means looking toward -X, so D and E are on the X-max end."
  - "SIDE (RIGHT) ELEVATION draws the two C windows with the front on the viewer's LEFT: looking toward +X, so the C windows are on the X-zero end."
  - "FRONT ELEVATION draws door 1's sidelite on the viewer's left, which is toward X-max; the floor plan draws it on the grid A side of the door."
  - "REAR ELEVATION draws the mini-split right of centre; facing the rear wall from outside, the viewer's right is toward X-max."
  source: "A-2.0 SIDE (LEFT), SIDE (RIGHT), FRONT and REAR ELEVATIONS; A-1.0 floor plan"

# ---------------------------------------------------------------------------
envelope:
  width:  {ft: 24.0,    raw: "24'-0\"", axis: X, source: "A-1.0 floor plan, overall string on the front (left) wall; S1.0 foundation plan 24'-0\""}
  depth:  {ft: 19.1667, raw: "19'-2\"", axis: Y, source: "A-1.0 floor plan, overall string along the bottom (grid B) wall; S1.0 foundation plan 19'-2\""}
  front_to_grid_2: {ft: 13.1667, raw: "13'-2\"", source: "A-1.0 floor plan, top string, grid 1 to grid 2"}
  grid_2_to_rear:  {ft: 6.0,     raw: "6'-0\"",  source: "A-1.0 floor plan, top string, grid 2 to grid 3"}
  area_check:
    value_sf: 460.0
    derived: "24 x 19 1/6 (19'-2\") = 460 exactly, the declared 460 S.F. (areas_declared.studio_sf); the 4-place decimal 19.1667 gives 460.0008"
  grid_check:
    ft: 19.1667
    derived: "13'-2\" + 6'-0\" = 19'-2\", the overall depth"

areas_declared:
  studio_sf:       {value: 460, source: "A-0.0 project data 'S.F. OF PROPOSED ADU: 460 S.F.'; A-1.0 LIGHT & VENTILATION 'STUDIO: 460 S.F.'"}
  optional_bedroom_sf: {value: 108, source: "A-1.0 LIGHT & VENTILATION 'OPTIONAL BEDROOM 1: 108 S.F.'", note: "1 bedroom option only"}

# ---------------------------------------------------------------------------
levels:
  datum: finished_floor
  finished_floor: {ft: 0.0, raw: "0'-0\"", source: "A-2.0 all four elevations, F.F. 0'-0\""}
  grade:          {ft: -0.5, raw: "-0'-6\"", source: "A-2.0 all four elevations, GRADE -0'-6\"",
                   note: "Grade is 6\" below the floor, stated, not assumed absent. A-3.0 detail 2 shows 6\" min. from grade to the wall base."}
  top_of_plate_rear:  {ft: 8.0,    raw: "8'-0\"",     label: "T.P. 1", source: "A-2.0 REAR ELEVATION and both side elevations, T.P. 1 8'-0\""}
  top_of_plate_front: {ft: 9.625,  raw: "9'-7 1/2\"", label: "T.P. 2", source: "A-2.0 FRONT ELEVATION and both side elevations, T.P. 2 9'-7 1/2\""}
  roof_top_at_front:  {ft: 10.7917, raw: "10'-9 1/2\"", source: "A-2.0 SIDE (RIGHT) ELEVATION, vertical string from F.F. to the top of the roof at its front edge",
                       note: "Not yet reconciled with the roof assembly; the P3 overlay (#130) does that. See discrepancies."}

# ---------------------------------------------------------------------------
roof:
  form: shed
  settled: >
    ONE ROOF PLANE, NOT TWO. The plan's first reading took the two plate
    heights and the separate "upper roof" and "bottom roof" venting as two roof
    planes. The sheets show one: both side elevations draw a single surface
    falling from T.P. 2 at the front wall to T.P. 1 at the rear, marked
    1" / 1'-0"; the rear elevation shows only T.P. 1; the roof plan is one
    rectangle with one slope arrow; and "upper" and "bottom" are its high and
    low eaves, each vented in the same 12 rafter bays. S1.0 frames it with one
    run of 2x12 rafters, and its drawing file is named "SHED ROOF".
  source: "A-2.0 SIDE (RIGHT) and SIDE (LEFT) ELEVATIONS, REAR ELEVATION, ROOF PLAN and ROOF PLAN NOTES; S1.0 MODEL A- ROOF FRAMING"
  high_side: "+Y front wall, T.P. 2"
  low_side: "Y 0 rear wall, T.P. 1"
  slope:
    rise_in: 1
    run_in: 12
    raw: "1\" / 1'-0\""
    source: "A-2.0 ROOF PLAN slope arrow; A-2.0 SIDE (RIGHT) ELEVATION slope arrow"
  plate_rise:
    ft: 1.625
    derived: "T.P. 2 9.625 - T.P. 1 8.0 = 1.625 ft (19 1/2\") over the 19.1667 ft depth"
  overhangs:
    front: {ft: 5.0, raw: "5'-0\"", source: "A-2.0 ROOF PLAN, 5'-0\" (OVERHANG) at the high edge, over the entry"}
    rear:  {ft: 1.5, raw: "1'-6\"", source: "A-2.0 ROOF PLAN, 1'-6\" (OVERHANG) at the low edge"}
    ends:  {ft: 1.5, raw: "1'-6\"", source: "A-2.0 ROOF PLAN, 1'-6\" (OVERHANG) at both side edges"}
    note: "S1.0 roof framing marks the front cantilever 5'-3\" MAX CANT, the structural limit on the 5'-0\" overhang."
  framing:
    rafters: "2x12 DF-L#2 @ 24\" OC, spanning front to rear"
    spacing_in: 24
    bays_vented_each_eave: 12
    bays_check: "24 ft of front wall / 2 ft rafter spacing = 12 bays, the count both eave vent tallies use"
    sheathing: "15/32\" structural grade I"
    headers: "RB3 6x8 over the front wall's three openings; RB4 6x6 over the rear wall's two; RB2 6x6 at the X-max (kitchen and bath) end over D and E; RB1 6x8 at the X-zero (living room) end over the two C windows. S1.0 is drawn in the same orientation as A-1.0."
    source: "S1.0 MODEL A- ROOF FRAMING, ROOF BEAM SCHEDULE and ROOF FRAMING NOTES; A-2.0 ROOF PLAN NOTES 'X 12 BAYS'"
  assembly:
    layers_top_down: ["standing seam metal roofing", "underlayment", "sheathing per structural",
                      "1\" air space for ventilation", "2x12 rafters", "10 1/4\" R-38 batts", "gyp board interior finish"]
    air_space:  {ft: 0.0833, raw: "1\"", source: "A-2.0 detail 7 ROOF SECTION"}
    insulation: {ft: 0.8542, raw: "10 1/4\"", source: "A-2.0 detail 7 ROOF SECTION, R-38 batts"}
    source: "A-2.0 detail 7 ROOF SECTION"
    # What #129 puts above the roof plane. The section dimensions the bay, not
    # the member, so the rafter depth is the bay: the batts plus the air space
    # over them come to exactly the 11 1/4" of the 2x12 S1.0 calls out, which
    # is the section agreeing with the framing plan rather than an assumption.
    rafter_depth: {ft: 0.9375, derived: "air_space 0.0833 + insulation 0.8542 = 0.9375 ft (11 1/4\"), the actual depth of the 2x12 in roof.framing.rafters"}
    sheathing_ft: {ft: 0.0391, raw: "15/32\"", source: "A-2.0 detail 7 ROOF SECTION 'SHEATHING PER STRUCTURAL'; S1.0 ROOF FRAMING NOTES give it as 15/32\" STRUCT GRADE I"}
    modelled_thickness: {ft: 0.9766, derived: "rafter_depth 0.9375 + sheathing_ft 0.0391. Roofing, underlayment and the interior gyp board are finishes (#132, #133) and add no modelled depth."}
    modelled_plane:
      through: ["T.P. 1 at the rear wall", "T.P. 2 at the front wall"]
      derived: "levels.top_of_plate_rear 8.0 and top_of_plate_front 9.625. The build puts the roof's UNDERSIDE on that plane and modelled_thickness above it, so #130 can gate the plane the elevations dimension rather than a surface nobody drew."
  ceiling: {follows: roof, raw: "CEILINGS FOLLOW ROOF LINE", source: "A-1.0 floor plan note in LIVING"}
  roofing: {material: standing_seam_metal, source: "A-2.0 FRONT ELEVATION and ROOF PLAN NOTES"}
  gutter:  {edge: "rear, the low eave", style: "seamless box gutter to match the roof, with a downspout", source: "A-2.0 ROOF PLAN leaders on the low edge"}
  ventilation:
    required_each_eave_si: 110.16
    provided_each_eave_si: 124.08
    per_bay: "2 x 4\" louvered round eave vents at 5.17 sq in each = 10.34 sq in per bay, x 12 bays"
    source: "A-2.0 ROOF PLAN NOTES, UPPER ROOF and BOTTOM ROOF VENTILATION"

# ---------------------------------------------------------------------------
construction:
  dimensions_to: "face of stud"
  dimensions_to_source: "A-1.0 floor plan note 'ALL DIMENSIONS TO FACE OF STUD U.N.O.'"
  exterior_wall:
    framing: "2x6 DF-L#2 @ 16\" OC, all exterior walls bearing"
    source: "A-1.0 WALL LEGEND '2X6 EXTERIOR WALL'; S1.0 ROOF FRAMING NOTES 8 and ROOF LEGEND"
    stud_depth: {ft: 0.4583, raw: "5 1/2\"", assumed: "the actual depth of a 2x6; A-3.0 and A-3.2 draw the stud but dimension none of the layers"}
    interior_finish: {ft: 0.0417, raw: "1/2\"", material: gypsum_board, source: "A-3.0 detail 1 STUCCO WALL SECTION '1/2\" GWB'; A-3.2 detail 1"}
    cladding_options:
      - {id: stucco, layers: ["sheathing per structural", "WRB", "self furring lath", "3 coat cement plaster"],
         source: "A-3.0 detail 1 STUCCO WALL SECTION"}
      - {id: fiber_cement_lap_siding, layers: ["sheathing per structural", "WRB", "fiber cement lap siding"],
         source: "A-3.2 detail 1 LAP SIDING WALL SECTION; A-3.2 LAP SIDING NOTES"}
    sheathing:
      ft: 0.0313
      raw: "3/8\""
      source: "S1.0 SHEARWALL SCHEDULE, '3/8\" APA RATED ONE FACE'"
      note: >
        The schedule governs shear walls. A-3.0 and A-3.2 say only "SHEATHING
        PER STRUCTURAL" for the wall sections, and S1.0 general note 1 defers
        to the plywood sheathing specification. #129 applies the schedule's
        thickness to every exterior wall, because the build models one wall
        type and the sheathed walls are the ones that set the outer face.
    cladding_modelled:
      ft: 0.0
      assumed: >
        ZERO, ON PURPOSE. Neither A-3.0 (stucco) nor A-3.2 (lap siding)
        dimensions its cladding, and the two are not the same thickness in
        any real assembly: three-coat cement plaster over self-furring lath
        runs about 7/8", fiber cement lap siding about 5/16" over its
        sheathing. Modelling each at its own thickness would move the outer
        faces of the building when the finish changed, and variants
        .exterior_finish records that change as a FINISH SWAP, not a geometry
        change -- the page swaps a baseColorFactor in the manifest (#131,
        #133), not a mesh. So the build stops the geometry at the sheathing
        face and carries the cladding as a material only. The error is at
        most seven eighths of an inch on a 24-foot building, below what the
        page can show at the distance a homeowner views it, and the overall
        dimensions this model publishes stay the ones A-1.0 draws.
      revisit: "#131 and #133, if the configurator ever needs the two finishes to differ in section"
    outer_face:
      derived: >
        face of stud + construction.exterior_wall.sheathing. The envelope
        dimensions are to face of stud (A-1.0 U.N.O.), so the modelled
        exterior surface sits 3/8" outboard of X 0, X 24, Y 0 and Y 19.1667.
      note: "#130's elevation overlay compares this face against A-2.0"
    casing_reveal: {ft: 0.0313, raw: "3/8\"", source: "A-3.0 details 3 and 4, 0'-0 3/8\" at the metal casing bead"}
  interior_wall:
    framing: "2x4, gyp board both sides"
    source: "A-1.0 WALL LEGEND '2X4 INTERIOR WALL: GYP. BOARD BOTH SIDES'"
    stud_depth: {ft: 0.2917, raw: "3 1/2\"", assumed: "the actual depth of a 2x4; not dimensioned on any sheet"}
  foundation:
    type: slab_on_grade
    slab: {ft: 0.3333, raw: "4\"", reinforcing: "#3 bars @ 18\" OC each way (or 6x6 #10 WWM) over 10 mil vapor barrier and 4\" crushed rock",
           source: "S1.0 MODEL A- FOUNDATION AND SHEARWALL PLAN slab callout"}
    footing: {type: FT1, width: {ft: 1.0, raw: "12\""}, depth: {ft: 1.0, raw: "12\""}, reinforcing: "2 #4 continuous",
              source: "S1.0 FOOTING SCHEDULE FT1"}
    source: "A-0.0 project data 'FOUNDATION: SLAB ON GRADE'; S1.0"

# ---------------------------------------------------------------------------
openings:
  # SIZES are the schedules on A-1.0. POSITIONS are the floor plan's dimension
  # strings on A-1.0, turned into X or Y in the frame above: nothing here is
  # measured off a raster. `x0`/`x1` run along the wall; Z heights come from
  # the schedule's sill and height.
  window_types:
    source: "A-1.0 Window Schedule"
    info: "vinyl frame, U 0.29, SHGC 0.21, Energy Star, low-E"
    info_source: "A-1.0 WINDOW INFORMATION"
    types:
    - {mark: A, source: "A-1.0 Window Schedule", count_scheduled: 2, operation: casement, width: {ft: 4.0, raw: "4'-0\""}, height: {ft: 4.0, raw: "4'-0\""}, sill: {ft: 3.0, raw: "3'-0\""}}
    - {mark: B, source: "A-1.0 Window Schedule", count_scheduled: 1, operation: fixed,    width: {ft: 4.0, raw: "4'-0\""}, height: {ft: 1.5, raw: "1'-6\""}, sill: {ft: 7.6667, raw: "7'-8\""},
       note: "the schedule counts 1; the plan and front elevation draw 2 -- see discrepancies"}
    - {mark: C, source: "A-1.0 Window Schedule", count_scheduled: 3, operation: fixed,    width: {ft: 5.0, raw: "5'-0\""}, height: {ft: 2.0, raw: "2'-0\""}, sill: {ft: 5.0, raw: "5'-0\""}}
    - {mark: D, source: "A-1.0 Window Schedule", count_scheduled: 1, operation: casement, width: {ft: 3.5, raw: "3'-6\""}, height: {ft: 3.5, raw: "3'-6\""}, sill: {ft: 3.5, raw: "3'-6\""}}
    - {mark: E, source: "A-1.0 Window Schedule", count_scheduled: 1, operation: sliding,  width: {ft: 3.0, raw: "3'-0\""}, height: {ft: 1.5, raw: "1'-6\""}, sill: {ft: 5.5, raw: "5'-6\""}}
  door_types:
    source: "A-1.0 Door Schedule"
    types:
    - {source: "A-1.0 Door Schedule", mark: "1", location: entry, application: exterior, description: "entry door with 12\" sidelite", glazing: tempered, hardware: entry,
       width: {ft: 3.0, raw: "3'-0\""}, height: {ft: 6.6667, raw: "6'-8\""}}
    - {source: "A-1.0 Door Schedule", mark: "2", location: pantry, application: interior, description: bi-fold, width: {ft: 4.0, raw: "4'-0\""}, height: {ft: 7.0, raw: "7'-0\""}}
    - {source: "A-1.0 Door Schedule", mark: "3", location: closet, application: interior, width: {ft: 2.3333, raw: "2'-4\""}, height: {ft: 6.6667, raw: "6'-8\""}}
    - {source: "A-1.0 Door Schedule", mark: "4", location: laundry, application: interior, description: "bi-fold (louvered)", width: {ft: 2.5, raw: "2'-6\""}, height: {ft: 6.6667, raw: "6'-8\""}}
    - {source: "A-1.0 Door Schedule", mark: "5", location: bathroom, application: interior, hardware: privacy, width: {ft: 3.0, raw: "3'-0\""}, height: {ft: 6.6667, raw: "6'-8\""}}
    - {source: "A-1.0 Door Schedule", mark: "6", location: rear entry, application: exterior, glazing: tempered, hardware: entry, width: {ft: 3.0, raw: "3'-0\""}, height: {ft: 6.6667, raw: "6'-8\""}}
    - {source: "A-1.0 Door Schedule", mark: "7", location: optional bedroom, application: interior, description: pocket, hardware: privacy, option: one_bedroom,
       width: {ft: 3.0, raw: "3'-0\""}, height: {ft: 6.6667, raw: "6'-8\""}}

  front_wall:
    wall: "Y 19.1667; the string runs from grid A (X 24) to grid B (X 0)"
    string: ["3'-7\"", "4'-0\"", "2'-5\"", "4'-0\"", "2'-5\"", "4'-0\"", "3'-7\""]
    string_check: {ft: 24.0, derived: "3'-7\" + 4'-0\" + 2'-5\" + 4'-0\" + 2'-5\" + 4'-0\" + 3'-7\" = 24'-0\""}
    source: "A-1.0 floor plan, the dimension string along the front (left) wall, read from grid A down"
    openings:
    - {id: W-A1, type: A, x0: 16.4167, x1: 20.4167, derived: "grid A is X 24: 24 - 3'-7\" = 20.4167, less the 4'-0\" window"}
    - {id: W-B1, type: B, x0: 16.4167, x1: 20.4167, derived: "the (ABOVE) transom over W-A1, same width",
       source: "A-1.0 floor plan '(ABOVE)' tag with B over A; A-2.0 FRONT ELEVATION"}
    - {id: D-1, type: "1", x0: 10.0, x1: 14.0, derived: "24 - (3'-7\" + 4'-0\" + 2'-5\") = 14.0, less the 4'-0\" opening: the 3'-0\" door and its 12\" sidelite",
       sidelite_x: [13.0, 14.0], leaf_x: [10.0, 13.0],
       sidelite_source: "A-1.0 floor plan draws the sidelite on the grid A side of the door; A-2.0 FRONT ELEVATION draws it on the viewer's left, which is toward X-max"}
    - {id: W-A2, type: A, x0: 3.5833, x1: 7.5833, derived: "grid B is X 0: 3'-7\" from it, then the 4'-0\" window"}
    - {id: W-B2, type: B, x0: 3.5833, x1: 7.5833, derived: "the (ABOVE) transom over W-A2, same width",
       source: "A-1.0 floor plan '(ABOVE)' tag with B over A; A-2.0 FRONT ELEVATION"}

  rear_wall:
    wall: "Y 0; the string runs from the bath's partition toward grid B (X 0)"
    string: ["3'-9 1/2\"", "3'-0\"", "1'-7\"", "5'-0\"", "1'-7\""]
    source: "A-1.0 floor plan, the dimension string along the rear (right) wall, ending at grid B"
    string_start: {ft: 14.9583, derived: "the string totals 14'-11 1/2\" and ends at grid B, X 0, so it starts at X 14.9583: 9'-0 1/2\" from grid A, at the bath's partition; #129 confirms which face"}
    openings:
    - {id: D-6, type: "6", x0: 8.1667, x1: 11.1667, derived: "string start 14.9583 - 3'-9 1/2\" = 11.1667, less the 3'-0\" door"}
    - {id: W-C3, type: C, x0: 1.5833, x1: 6.5833, derived: "8.1667 - 1'-7\" = 6.5833, less the 5'-0\" window; 1'-7\" remains to grid B, X 0"}

  end_wall_x24:
    wall: "X 24 (grid A), the kitchen and bath end; Y from 0 (rear) to 19.1667 (front)"
    source: "A-1.0 floor plan, the top dimension strings: 4'-11\" and 3'-6\" from grid 1 (front), 3'-0\" and 2'-0\" to grid 3 (rear)"
    string_from_front: ["4'-11\"", "3'-6\""]
    string_to_rear: ["3'-0\"", "2'-0\""]
    openings:
    - {id: W-D1, type: D, y0: 10.75, y1: 14.25, derived: "front 19.1667 - 4'-11\" = 14.25, less the 3'-6\" window = 10.75"}
    - {id: W-E1, type: E, y0: 2.0, y1: 5.0, derived: "2'-0\" from the rear, then the 3'-0\" window"}

  end_wall_x0:
    wall: "X 0 (grid B), the living room end; Y from 0 (rear) to 19.1667 (front)"
    string: ["2'-6\"", "5'-0\"", "4'-2\"", "5'-0\"", "2'-6\""]
    string_check: {ft: 19.1667, derived: "2'-6\" + 5'-0\" + 4'-2\" + 5'-0\" + 2'-6\" = 19'-2\""}
    source: "A-1.0 floor plan, the bottom dimension string, from grid 1 (front) to grid 3 (rear)"
    openings:
    - {id: W-C1, type: C, y0: 11.6667, y1: 16.6667, derived: "front 19.1667 - 2'-6\" = 16.6667, less the 5'-0\" window"}
    - {id: W-C2, type: C, y0: 2.5, y1: 7.5, derived: "2'-6\" from the rear, then the 5'-0\" window"}

  count_check:
    windows_drawn: {A: 2, B: 2, C: 3, D: 1, E: 1, derived: "the openings above; B differs from the schedule's 1"}

# ---------------------------------------------------------------------------
interior_partitions:
  # The plan's interior strings, recorded as drawn. Turning them into wall
  # centrelines is P2's job (#129), with this sheet open: several strings run
  # to a wall face whose side is not stated.
  grid_2:
    y: 6.0
    derived: "envelope.grid_2_to_rear: grid 2 is 6'-0\" from the rear face, 13'-2\" from the front"
    carries: "the bath's front wall and the kitchen's rear limit"
  rooms: [kitchen, pantry (with the water heater), closet, laundry (W/D), bath (tub, toilet, 36\" vanity), living]
  rooms_source: "A-1.0 floor plan room tags"
  dimension_strings:
    source: "A-1.0 floor plan, interior dimension strings"
    status: "where each string is DRAWN, and along which axis. What each one spans -- which walls, which faces -- is #129's to read; nothing here says."
    strings:
    - {raw: "6'-6 1/2\"", drawn: "beside the KITCHEN label", runs_along: X, ft: 6.5417}
    - {raw: "5'-2\"",     drawn: "above the PANTRY and door 2", runs_along: Y, ft: 5.1667}
    - {raw: "2'-6\"",     drawn: "beside the PANTRY", runs_along: X, ft: 2.5}
    - {raw: "6'-2\"",     drawn: "between the KITCHEN and the CLOSET", runs_along: X, ft: 6.1667}
    - {raw: "3'-9\"",     drawn: "in the BATH, beside door 5", runs_along: Y, ft: 3.75}
    - {raw: "3'-0\"",     drawn: "in the BATH, beside the toilet", runs_along: X, ft: 3.0}
    - {raw: "3'-2\"",     drawn: "below the W/D", runs_along: Y, ft: 3.1667}
    - {raw: "7'-3\"",     drawn: "below the CLOSET and W/D", runs_along: Y, ft: 7.25}

  # -------------------------------------------------------------------------
  # P2 (#129) READS THE STRINGS ABOVE ONTO WALLS AND FACES.
  #
  # Method. Each face below is fixed by arithmetic from a string in
  # `dimension_strings` or from `envelope`, and then CHECKED against A-1.0 by
  # scaling: page 4 rendered at 400 dpi, where the sheet's 1/4" = 1'-0" makes
  # one foot exactly 100 px, with the frame registered on the four exterior
  # stud faces. The check is a check, never the source -- a face is only
  # written here when a string puts it there. Every residual is reported in
  # `scale_check` below; the largest is 0.6".
  #
  # The strings turn out to read outside-face to outside-face:
  #   6'-6 1/2"  X 24.0000 .. 17.4583   the X 24 wall's outside face of stud
  #                                     to the pantry's far wall
  #   2'-6"      X 17.4583 .. 14.9583   the pantry block, outside to outside
  #   6'-2"      X 17.4583 .. 11.2917   pantry and closet together
  #   7'-3"      Y 11.4167 ..  4.1667   the closet and laundry block
  #   3'-2"      Y  7.3333 ..  4.1667   the laundry
  #   5'-2"      agrees with the 7'-3" reading to within 1/2" (see
  #              discrepancies.the-half-inch-in-the-interior-strings)
  #   3'-9"      not resolved onto a pair of faces; see the same entry
  layout:
    datum: "the frame above: X 0 and Y 0 are the outside faces of stud at the living-room end and the rear wall"
    thickness:
      ft: 0.2917
      derived: "construction.interior_wall.stud_depth, 3 1/2\" -- gyp board is a finish (#132) and is not modelled here"
    height:
      to: roof_underside
      assumed: >
        Every partition runs from the slab to the underside of the roof plane.
        A-1.0 tags the LIVING room "CEILINGS FOLLOW ROOF LINE" and no sheet
        draws a partition head height or a flat ceiling over the bath, closet
        or laundry. Running them all to the roof is the one reading that needs
        no number nobody drew. #132 revisits it if a flat ceiling appears.
    partitions:
    - id: P_bath_W
      runs_along: X
      at_ft: 6.0
      studs_toward: "+Y"
      from_ft: 14.9583
      to_ft: 23.5417
      derived: >
        envelope.front_to_grid_2 and grid_2_to_rear put grid 2 at Y 6.0, which
        is 6'-0" from the rear wall's outside face of stud. A-1.0 dimensions to
        face of stud, so Y 6.0 is this wall's bath-side face and its 3 1/2"
        studs run to Y 6.2917. It spans from the X 24 wall's interior face
        (24 - 5 1/2" = 23.5417) to P_bath_S at X 14.9583.
      separates: [bath, kitchen]
    - id: P_bath_S
      runs_along: Y
      at_ft: 14.9583
      studs_toward: "-X"
      from_ft: 0.4583
      to_ft: 11.4167
      derived: >
        openings.rear_wall.string_start: the rear wall's string totals
        14'-11 1/2" and ends at grid B, so it starts at X 14.9583, at the
        bath's partition. #128 left which face open; the scale check settles
        it as the bath-and-pantry side, with the studs running down to
        X 14.6667. It spans from the rear wall's interior face (0.4583) to
        P_block_W at Y 11.4167, and carries door 5.
      separates: [bath, pantry, laundry, living]
    - id: P_block_W
      runs_along: X
      at_ft: 11.4167
      studs_toward: "-Y"
      from_ft: 11.2917
      to_ft: 17.4583
      derived: >
        the 7'-3" string is the closet-and-laundry block outside to outside,
        Y 4.1667 to 11.4167, so 11.4167 is this wall's living-room face and
        its studs run to Y 11.125. It spans the whole block depth, from
        P_block_S at X 11.2917 to P_pantry_N at X 17.4583.
      separates: [living, closet, pantry]
    - id: P_laundry_W
      runs_along: X
      at_ft: 7.625
      studs_toward: "-Y"
      from_ft: 11.2917
      to_ft: 14.6667
      derived: >
        the closet is what the 7'-3" and 3'-2" strings leave between them:
        11.125 (P_block_W's closet face) - 3'-6" = 7.625, and the 3 1/2" studs
        run to Y 7.3333, which is where the 3'-2" laundry begins. The 3'-6"
        closet is the arithmetic, not a string on the sheet.
      separates: [closet, laundry]
    - id: P_laundry_E
      runs_along: X
      at_ft: 4.1667
      studs_toward: "+Y"
      from_ft: 11.2917
      to_ft: 14.6667
      derived: >
        the 3'-2" and 7'-3" strings both end at Y 4.1667, the block's outside
        face at the laundry end; the studs run to Y 4.4583. A-1.0 draws this
        as two jamb returns rather than a full wall, because the laundry opens
        through it. It is modelled as a wall so door 4 is a cut opening in it.
      separates: [laundry, bath_approach]
    - id: P_block_S
      runs_along: Y
      at_ft: 11.5833
      studs_toward: "-X"
      from_ft: 4.1667
      to_ft: 11.4167
      derived: >
        the 6'-2" string is the pantry and closet together, X 17.4583 to
        11.2917, so 11.2917 is this wall's living-room face and 11.5833 the
        closet and laundry side. It spans the block's width and carries door 3.
      separates: [living, closet, laundry]
    - id: P_pantry_N
      runs_along: Y
      at_ft: 17.1667
      studs_toward: "+X"
      from_ft: 6.2917
      to_ft: 11.4167
      derived: >
        the 6'-6 1/2" string runs from the X 24 wall's outside face of stud to
        X 17.4583, and the 2'-6" string runs from there back to P_bath_S at
        X 14.9583: the pantry block, outside to outside. So 17.4583 is this
        wall's kitchen face and 17.1667 its pantry face. It carries door 2.
      separates: [kitchen, pantry]

    # Interior door openings. Widths and heights are the A-1.0 Door Schedule
    # (openings.door_types); only the position along the wall is decided here.
    door_openings:
    - id: D-2
      type: "2"
      in: P_pantry_N
      along: Y
      a_ft: 7.125
      b_ft: 11.125
      derived: >
        the pantry's clear width is Y 6.2917 to 11.125, 4'-10"; the schedule's
        4'-0" bi-fold drawn against the closet wall leaves 10" of wall at the
        P_bath_W end, which is how A-1.0 draws it.
    - id: D-3
      type: "3"
      in: P_block_S
      along: Y
      a_ft: 8.2083
      b_ft: 10.5417
      assumed: >
        centred in the closet's clear width (Y 7.625 to 11.125, midpoint
        9.375), because no string dimensions this door. A-1.0 draws it about
        centred; the scale check puts the drawn gap's midpoint at Y 9.44,
        0.8" from this.
    - id: D-4
      type: "4"
      in: P_laundry_E
      along: X
      a_ft: 11.875
      b_ft: 14.375
      assumed: >
        centred in the laundry's clear depth (X 11.5833 to 14.6667, midpoint
        13.125), because no string dimensions this door either. The scale
        check puts the drawn jamb returns at X 11.75 and 14.30, a midpoint
        1.2" from this.
    - id: D-5
      type: "5"
      in: P_bath_S
      along: Y
      a_ft: 0.7083
      b_ft: 3.7083
      assumed: >
        the schedule's 3'-0" hung against the rear wall, leaving a 3" jamb
        return at Y 0.4583. A-1.0 draws P_bath_S stopping at about Y 3.71 and
        the door leaf swung back against the rear wall, which is this opening
        within 0.1". The 3'-9" string sits beside this door but does not
        resolve onto a pair of faces -- see discrepancies.
    door_head:
      from: floor
      derived: "each opening runs from the slab to its schedule height in openings.door_types; A-1.0 gives no head height, and a door sits on the floor"

    # Every face above, against A-1.0 scaled at 1/4" = 1'-0". Residual is
    # measured minus written, in inches. The rendering resolves about 1".
    scale_check:
      method: "page 4 at 400 dpi, 1 ft = 100 px, registered on the four exterior faces of stud; the drawn wall band is stud plus 1/2\" gyp board each side"
      residuals_in:
        P_bath_W_bath_face:      {value:  -0.14, derived: "measured 5.988 against 6.0"}
        P_bath_S_bath_face:      {value:   0.02, derived: "measured 14.960 against 14.9583"}
        P_bath_S_far_face:       {value:   0.18, derived: "measured 14.682 against 14.6667"}
        P_block_W_living_face:   {value:   0.42, derived: "measured 11.452 against 11.4167"}
        P_block_W_closet_face:   {value:   0.59, derived: "measured 11.174 against 11.125"}
        P_laundry_W_closet_face: {value:   0.25, derived: "measured 7.646 against 7.625"}
        P_laundry_W_far_face:    {value:   0.43, derived: "measured 7.369 against 7.3333"}
        P_block_S_living_face:   {value:   0.02, derived: "measured 11.293 against 11.2917"}
        P_block_S_far_face:      {value:  -0.09, derived: "measured 11.576 against 11.5833"}
        P_pantry_N_kitchen_face: {value:   0.16, derived: "measured 17.472 against 17.4583"}
      largest_in: {value: 0.59, derived: "P_block_W_closet_face; every face is within 0.6\", and the rendering resolves about 1\""}

# ---------------------------------------------------------------------------
fixtures:
  status: "not yet: Tier 3 (#134) measures and builds them"
  named_equipment:
    water_heater: {model: "RHEEM PROPH 40T2R H37515", kind: "NEEA-rated heat pump water heater", location: pantry,
                   source: "A-1.0 WATER HEATER NOTES 'PER CF1R: NEEA RATED WATER HEATER HEAT PUMP MODEL, RHEEM PROPH 40T2R H37515'; A-1.0 floor plan W/H in PANTRY"}
    mini_split_condenser: {location: "exterior, on the ground at the rear wall toward the X-max (kitchen and bath) end: right of centre in the rear elevation, near the rear corner in the side (left) elevation",
                           source: "A-2.0 REAR ELEVATION and SIDE (LEFT) ELEVATION 'MINI-SPLIT CONDENSER'"}

finishes:
  status: "not yet: Tier 1 (#132) and Tier 2 (#133)"
  exterior_options: [stucco, fiber_cement_lap_siding]
  exterior_source: "A-1.0 WALL LEGEND; A-2.0 FRONT ELEVATION 'EXTERIOR FINISH OPTIONS'"
  roofing: standing_seam_metal
  roofing_source: "A-2.0 ROOF PLAN NOTES"

# ---------------------------------------------------------------------------
export:
  status: "the manifest itself is #131; the page's views rail is #133"
  # ONE DEFINITION OF WHAT EACH MODE HIDES. The barn cabin learned this the
  # hard way: views.py knew how to strip a roof and the web runtime had no way
  # to ask, so the answer existed twice. It lives here, in the spec, so that
  # Blender's review panel (views.py) and the manifest #131 writes read the
  # same thing. Groups are OBJECT-NAME PREFIXES, which build.py sets; a new
  # prefix must be declared here or the modes silently stop covering it.
  display_modes:
    groups:
      ROOF:      ["Roof_"]
      WALL:      ["Wall_"]
      SKIN:      ["Sheathing_"]
      PARTITION: ["P_"]
      OPENING:   ["Sash_", "Leaf_"]
      SITE:      ["Slab"]
    front_group: "the +Y side: Wall_front and Sheathing_front, named in modes by object"
    modes:
    - id: full
      label: "Exterior"
      default: true
      hide: []
    - id: dollhouse
      label: "Show interior"
      desc: "Roof off — look down into the rooms. Laurel has no ceiling objects to hide: the ceilings ARE the roof underside, because every wall runs to it."
      hide: [ROOF]
    - id: cutaway
      label: "Cutaway"
      desc: "Dollhouse with the front wall and its skin removed, for a sectional look through the entry."
      hide: [ROOF]
      hide_objects: [Wall_front, Sheathing_front]
    - id: interior_only
      label: "Interior only"
      desc: "Partitions and slab alone, with the openings left in so the doors read."
      hide: [ROOF, WALL, SKIN]

variants:
  floor_plan_options:
    source: "A-1.0 drawings 1 and 2"
    studio: {built: true, note: "the chosen plan; see option_selection"}
    one_bedroom:
      built: false
      future: "a configurator choice (#133): a partition, pocket door 7, and window C operable to meet ventilation"
      bedroom_width: {ft: 9.5, raw: "9'-6\"", source: "A-1.0 drawing 2 1 BEDROOM FLOOR PLAN OPTION"}
      window_note: "A-1.0 drawing 2 'WINDOW TO BE OPERTIONAL FOR 1 BEDROOM OPTION TO MEET VENTILATION REQUIREMENTS'"
  exterior_finish: "stucco or fiber cement lap siding, both on the sheet: a finish swap, not a decision (#131, #133)"
  canopy:
    optional: true
    source: "A-2.0 FRONT ELEVATION 'OPTIONAL CANOPY SEE A-3.4'; A-3.4 AWNING DETAILS '2X6 CEDAR CANOPY FRAME'"

# ---------------------------------------------------------------------------
discrepancies:
  - id: the-half-inch-in-the-interior-strings
    impact: >
      Two of A-1.0's interior strings do not land on the same faces as the
      rest, by half an inch and by an unknown amount.

      The 5'-2" string drawn above the PANTRY runs along Y. Read from
      P_bath_W's kitchen face (Y 6.2917) it ends at Y 11.4583; the 7'-3" and
      3'-2" strings put P_block_W's living-room face at Y 11.4167. The two
      readings differ by 1/2", which is one thickness of gyp board -- the
      likeliest cause is one string drawn to a finished face and the other to
      face of stud, on a sheet whose note says face of stud U.N.O.

      The 3'-9" string drawn in the BATH beside door 5 runs along Y. Scaling
      puts its ends at about Y 4.67 and Y 0.92, which is neither a pair of
      wall faces nor the door opening this spec writes. What it dimensions is
      not established.
    resolution: >
      interior_partitions.layout follows the 7'-3" and 3'-2" reading, because
      those two agree with each other, with the 6'-2" and 2'-6" depths, and
      with the scale check to within 0.6", while the 5'-2" reading disagrees
      with the scale check by more. The half inch is below what the page can
      show and below what #130's overlay can resolve.

      The 3'-9" string is left unresolved. Door 5's opening is written from
      the schedule's 3'-0" width and the drawn end of P_bath_S, and is marked
      `assumed`. Nothing in this model depends on 3'-9" meaning what one
      guess or another says it means, so nothing is invented to make it fit.
    open: "if #130's overlay of the side elevations disagrees at the bath, this string is the first thing to re-read"
  - id: the-first-draft-of-this-spec-mirrored-the-plan
    impact: >
      The first draft put X 0 at the kitchen and bath end and said X ran left to
      right as seen from the front. In this right-handed frame X runs to the
      viewer's LEFT, so every front- and rear-wall position was mirrored: built
      as written, the kitchen and bath would have stood at the wrong end
      relative to the entry. The spec lint could not catch it -- every number
      was cited and every drawn length was on its sheet -- because the error
      was in the frame, not the numbers. Found by reading the side elevations
      against the plan before the PR merged.
    resolution: >
      X 0 is the living room end (grid B), X 24 the kitchen and bath end (grid
      A). Front- and rear-wall positions are 24 minus their first-draft values;
      the end walls kept their Y positions and swapped labels. `frame` records
      the elevations that fix the direction, so it is checkable. The P3 overlay
      (#130) should compare the side elevations too, not only the front.
    source: "A-2.0 SIDE (LEFT) and SIDE (RIGHT) ELEVATIONS; A-1.0 floor plan"
  - id: the-roof-is-one-shed-not-two-planes
    impact: >
      The Laurel plan's first reading, and #128's own risk note, said two
      plate heights and upper/lower roof venting meant two roof planes. P3's
      check (#130) was written for that: "the two roof planes meet the two
      declared plate heights".
    resolution: >
      One shed roof. See roof.settled for the five things on the sheets that
      say so. #130's check becomes: the single roof plane passes through T.P. 2
      at the front wall and T.P. 1 at the rear.
    source: "A-2.0 elevations and ROOF PLAN; S1.0 MODEL A- ROOF FRAMING"
  - id: the-plates-rise-slightly-more-than-the-slope
    impact: >
      T.P. 2 - T.P. 1 is 19 1/2" over a 19'-2" depth: 1.017" per foot, where
      the roof is marked 1" per foot. Over the depth that is 0.33".
    resolution: >
      The plate heights are dimensioned; the slope is a nominal callout. Build
      to the plates. The P3 overlay (#130) confirms against the elevation.
    source: "A-2.0 SIDE (RIGHT) ELEVATION, T.P. 1, T.P. 2 and the 1\" / 1'-0\" arrow"
  - id: window-b-is-scheduled-once-and-drawn-twice
    impact: "The window schedule counts one B; the floor plan tags B over both A windows, and the front elevation draws two."
    resolution: "Build two. The plan and elevation agree, and the schedule's count is the one number that disagrees with both."
    source: "A-1.0 Window Schedule, count 1; A-1.0 floor plan (ABOVE) tags; A-2.0 FRONT ELEVATION"
  - id: the-sheet-index-lists-one-structural-sheet
    impact: "A-0.0 SHEET INDEX lists S1.0 only; the set carries four structural pages: specifications, S1.0, SD1 and SD2."
    resolution: "Recorded in sheet_index. S1.0 is the only structural sheet this spec cites."
    source: "A-0.0 SHEET INDEX; pages 13 to 16"
  - id: roof-height-at-the-front-edge-is-not-yet-reconciled
    impact: "10'-9 1/2\" from F.F. to the top of the roof at its front edge has not been checked against T.P. 2, the 2x12 rafter and the roofing."
    resolution: "Left to the P3 overlay (#130), which is where a wrong roof reading shows."
    source: "A-2.0 SIDE (RIGHT) ELEVATION"
