  mounted:
    # WALL-MOUNTED FIXTURES. A DIFFERENT ANCHOR FROM EVERYTHING ABOVE.
    #
    # Every fixture in this section so far stands on a floor inside a measured
    # footprint: x, y, w, d. A sconce does not. It hangs on a named wall, a
    # distance along it, at a height, facing out. Forcing it into the footprint
    # datum would mean inventing a footprint it does not have, so this
    # subsection carries its own.
    datum: >
      `surface` names a wall object from build_adu. `along` is measured from the
      WEST exterior corner — the same datum as openings.main_floor, so a sconce
      and a door can be compared directly. `height_aff` is to the CENTRE OF THE
      WALL CANOPY above main finished floor. `facing` is the outward normal in
      the model frame (east=+X, north=+Y, up=+Z).
    source_rule: >
      THE PLAN SET CANNOT SOURCE THIS AND NEVER COULD. The AUTHORITY RULE at the
      top of this file says the PDF is the only geometry authority and video may
      flag a discrepancy but never override a plan dimension. Nothing here
      overrides anything: the sheet index runs A0.0, A1.0, A1.1, A2.0, A3.0,
      A4.0, N-1 and there is NO ELECTRICAL SHEET — no sheet on which a light
      fixture could be drawn. So the video is not a second opinion here, it is
      the only opinion, and every number below is marked accordingly.
      This is the first POSITION in this spec taken from footage rather than a
      drawing. Earlier video use was confined to colour and to settling which
      option was toured.
    product_source:
      doc: "example plans/thataduguy/SHOPPING-GUIDE.pdf, page 9"
      heading: WALL-MOUNTED LIGHTS
      item: "Westinghouse Galvanized Steel Finish Lighting Fixture"
      ref_image: refs/shopping_guide_wall_sconce.png
      gives: >
        FAMILY AND FINISH, NOT DIMENSIONS. The guide names no size and carries no
        spec sheet, so it settles what the fixture IS — a galvanized steel
        gooseneck barn sconce — and proportions are read off its product photo.
        It does not settle how big the installed one is; the video does that.
    measurement:
      frame: "video 1:37, front elevation of the porch — refs/video_porch_sconce_1-37.jpg"
      px_per_ft_h: 47.94
      px_per_ft_v: 48.45
      calibration: >
        HORIZONTAL, from the longest baseline the frame offers: the west edge of
        W-LIVING-S1 (offset 3.04) to the east edge of W-LIVING-S2 (offset 18.54)
        is 743 px for 15.50 ft. Checked against openings that were NOT used to
        set it: the front door's west jamb predicts px 556.9 and measures 556
        (-0.23"), its east jamb predicts 700.7 and measures 695 (-1.4").
        VERTICAL, from the front door leaf: 246 px (head, 6.667 ft) to 569 px
        (threshold, 0.0 ft) is 48.45 px/ft. The two scales differ by 1.1%, which
        is lens distortion in a 1280x720 action-camera frame, not a real
        anisotropy. Cross-check: the porch ceiling reads 8.13 ft against a
        8'-0" plate, +1.6".
      tolerance_in: 2.0
      why_tolerance_is_coarse: >
        The fixture is about 50 px wide in the only frame that shows it square
        on. Every edge is two or three pixels of blur. 1" precision is not
        available here and claiming it would be the same error the fixture
        footprints avoided by measuring drawn lines instead of ink boxes.
    items:
    - id: SCONCE_PORCH
      surface: Wall_S
      side: exterior
      facing: [0, -1, 0]
      along: {ft: 8.26, raw: "8'-3\"", source: "video 1:37, canopy centre at px x=508"}
      height_aff: {ft: 7.25, raw: "7'-3\"", source: "video 1:37, canopy centre at px y=210 reads 7.41; lowered 1.9\" to clear the porch ceiling — see discrepancies.sconce-does-not-fit-under-the-modelled-soffit"}
      form: gooseneck_barn
      material: fixture_galv
      lit_lens: true
      note: >
        Sits in the 2.36 ft of blank wall between the east edge of W-LIVING-S1
        (7.04) and the west jamb of D-FRONT (9.40). The centre of that gap is
        8.22; the fixture measures 8.26, so it is centred in the gap to within
        half an inch. That is a corroboration, not the source — it was measured
        first and noticed after.
      height_note: >
        7'-5" is high for a sconce beside a door, where 66"-72" is usual. It is
        not flanking the door, it is a downlight over the entry walk, mounted
        above the door head (6'-8") and above the house numbers. The video shows
        it clearly above a standing adult's head.
      confidence: measured_from_video_single_frame
      two_units_caveat: >
        video_sources records that the tour intercuts at least two different
        built units of this plan. The 1:37 frame is one exterior, so this sconce
        describes THAT unit's entry, not a fact about the design. It is a
        reasonable default and not a specification, which is the same footing
        the finishes sampled from the video sit on.
    forms:
      gooseneck_barn:
        # Proportions cross-checked two ways, and this is the reason the sizes
        # below are trusted at all. The product photo gives an overall
        # height-to-shade-width ratio of 0.927 (179 px by 193 px). The installed
        # fixture in the video gives 0.930 (0.970 ft by 1.043 ft). Two different
        # images of two different objects agreeing to 0.3% is what says the
        # guide's fixture and the built fixture are the same thing.
        shade_dia:    {ft: 1.00,  raw: "12\"",      source: "video, rim spans 50 px; a stock size, measured 12.5\""}
        shade_height: {ft: 0.42,  raw: "5\"",       confidence: assumed, source: "product photo proportion"}
        neck_dia:     {ft: 0.22,  raw: "2-5/8\"",   confidence: assumed, source: "product photo — the ribbed fitter is visible in the video too"}
        neck_height:  {ft: 0.17,  raw: "2\"",       confidence: assumed}
        canopy_dia:   {ft: 0.40,  raw: "4-3/4\"",   confidence: derived,
                       source: "shade_dia divided by the product photo's 2.57 shade:canopy ratio. Measured directly off the video it reads 6.8\", but the canopy is half-hidden behind the shade there and its edge is the blurriest in the frame."}
        canopy_depth: {ft: 0.15,  raw: "1-3/4\"",   confidence: assumed}
        arm_dia:      {ft: 0.06,  raw: "3/4\"",     confidence: assumed, source: "nominal pipe"}
        rise:         {ft: 0.60,  raw: "7-1/4\"",   source: "video, canopy centre y=210 to arm peak y=181"}
        projection:   {ft: 0.79,  raw: "9-1/2\"",   confidence: estimated_from_parallax}
        projection_method: >
          A frontal frame cannot measure depth directly, so this comes from
          parallax. The arm's two legs sit 13 px apart on screen at 140 px left
          of frame centre; for a pinhole camera that separation is the arc's
          depth times the offset over the camera distance. Camera distance is
          itself derived: the man in frame measures 445 px where a 5'-10" adult
          at the wall plane would measure 283 px, so he is magnified 1.57x, so
          the camera is 2.75x his standoff. At a mid-porch standoff of 3 ft that
          puts the camera 8.3 ft out and the projection at 9.5".
          EVERY STEP OF THAT IS AN ESTIMATE. Treat it as +/- 3", and note the
          check it does pass: with these numbers the shade rim lands at 7.03 ft
          and the video measures 7.04.
        clearance_note: >
          The arm peaks at 8.01 ft. The porch ceiling is the 8'-0" plate. The
          fixture therefore very nearly touches the soffit, which looks wrong
          and is what the frame shows. verify_mounted.py gates it rather than
          trusting it.

  furniture:
    # Settled in TIER-3 section 4: furniture and appliances are both SHOWN and
    # neither is included in the price, matching how Studio-Home presents its
    # defaults. Furniture is architectural fill-in-the-space — schematic,
    # neutral, unbranded — there to let a buyer read scale and circulation.
    #
    # It is NOT ON THE PLAN. Nothing below is measured, and nothing below should
    # be verified against A1.1, because the sheet says nothing about it.
    status: placed
    disclosure_required: "Furniture and appliances shown for scale; not included. This is a UI requirement — no part of the model can enforce it."
    prefixes: {furniture: "Furn_", appliances: "Appl_"}
    datum: >
      WORLD FEET IN THE MODEL FRAME — x east from the west exterior face, y
      north from the porch outer edge, z above finished floor. NOT the
      fixtures datum, which measures from interior faces, because furniture is
      placed in a room rather than measured off a sheet.
    provenance: >
      NOTHING HERE IS A PLAN DIMENSION. The sheet set specifies no furniture at
      all. Sizes are typical-product figures and the pieces are read off frames
      of the builder's tour video, cited per arrangement. Positions are chosen
      to clear the fixtures and doors that ARE measured. Every entry is
      confidence: assumed, and a furniture guess must never inherit the
      credibility of a measured fixture.
    grouping: >
      ONE OBJECT GROUP PER SWITCHABLE ARRANGEMENT, NOT ONE PER MATERIAL.
      build_adu otherwise merges by material across the whole building --
      multibox("Appl_body", ...) puts the fridge, the range, the dishwasher and
      the bedroom-closet washer/dryer in a SINGLE mesh. Furniture built that
      way could never be switched, because you cannot hide half a mesh, and
      #76 would have to rebuild it. So each arrangement owns its objects and
      merging happens only WITHIN one. This deliberately breaks the house
      convention; the reason is the whole point.
    default_note: >
      TWO ARRANGEMENTS SHARE THE BEDROOM AND THEY OCCUPY THE SAME FLOOR. They
      are alternatives, not companions — the tour video stages that room as a
      bedroom at 4:13 and as an office at 4:10, twenty seconds apart, which is
      the whole reason both are built. So an intersection gate must NOT treat
      bed-through-desk as a defect; only furniture against a FIXTURE or a wall
      is one.

      Both are built, because the presence-swap work can only toggle what
      already exists. But `lod0` ships ONE PER ROOM, chosen by `default: true`,
      because until that work lands there is nothing to do the choosing and a
      viewer would see a desk growing through a bed. When switching exists,
      `lod0` carries all of them and this flag becomes the initial state.
    arrangements:
    - id: living_sofa
      room: living
      default: true
      source: "tour video 2:38-2:45 — rust sofa, back to the kitchen, round tufted cushion"
      confidence: assumed
      clearance_note: >
        Back stands 2'-11" off the counter front (x 2.54), which is the
