  porch_slab_thickness: {ft: 0.333, raw: "4\"", source: "A2.0 '4\" CONC SLAB #4, 18\" GRID'"}
  ceiling_thickness: {ft: 0.0417, raw: "1/2\"", source: "Tier 1; standard gypsum board"}
  floor_finish_thickness: {ft: 0.0625, raw: "3/4\"", source: "Tier 1; standard finish floor over subfloor"}
