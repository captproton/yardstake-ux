    # A1.1 draws two concentric ovals plus three tap holes. The outer oval is
    # the rim, the inner is the bowl opening, and the bowl sits 1-1/4" EAST of
    # the rim centre — which is the tap deck, and is why the rim looks wider on
    # the wall side.
