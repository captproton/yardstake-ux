variants:
  # Configurator options, in the manner of the Studio-Home finishes picker.
  #
  # Every option here is a baseColorFactor change and NOTHING ELSE. That is
  # only possible because the albedo maps are neutral (see
  # materials.*.neutral_albedo): they carry the luminance pattern, the colour
  # rides on the factor. So the whole option set below adds ZERO texture bytes
  # to the payload, and new colours can be added without re-exporting.
  #
  # TIER-2 §6 weighed KHR_materials_variants against a runtime swap and chose
  # the runtime swap, to keep the initial load light for a homeowner on a
  # phone. finish_adu.py emits export/variants.json from this block.
  emit: variants.json
  property: baseColorFactor
  presence:
    # A SIBLING OF `sets`, NOT A SECOND MEANING FOR IT.
    #
    # `sets` swaps materials: `targets` sits at SET level and names materials,
    # and each option carries a `value`. A presence swap needs the opposite
    # shape -- the thing being named differs PER OPTION, because choosing "home
    # office" shows a different group of objects than choosing "bedroom". Bent
    # into `sets`, `targets` would come to mean "materials, unless the property
    # is visible, in which case ignore this and read the options" -- the kind of
    # overload that later reads as a bug.
    #
    # So presence is additive: a runtime that only knows `sets` keeps working
    # unchanged and simply never hides anything.
    #
    # Options name an ARRANGEMENT, not object names. finish_adu resolves the
    # arrangement to the node names it actually exported, so the manifest
    # carries what the runtime needs while the spec stays semantic and cannot
    # drift from the build.
    property: visible
    disclosure: >
      Furniture and appliances shown for scale; not included. THE MODEL CANNOT
      ENFORCE THIS -- it is carried here so the UI has no excuse for omitting
      it, and it is the reason presence exists at all: a buyer switching the
      bedroom to a home office is choosing a layout, not ordering a desk.
    sets:
    - id: bedroom_layout
      label: "Bedroom"
      room: bedroom
      options:
      - {id: bed,    label: "Bedroom",     arrangement: bedroom_bed, default: true}
      - {id: office, label: "Home office", arrangement: bedroom_office}
      - {id: empty,  label: "Unfurnished", arrangement: null}
    - id: living_layout
      label: "Living room"
      room: living
      options:
      - {id: sofa,  label: "Furnished",   arrangement: living_sofa, default: true}
      - {id: empty, label: "Unfurnished", arrangement: null}
    - id: porch_layout
      label: "Porch"
      room: porch
      options:
      - {id: chairs, label: "Furnished",   arrangement: porch_chairs, default: true}
      - {id: empty,  label: "Unfurnished", arrangement: null}
  sets:
    - id: color_theme
      label: Colour theme
      targets: [adu_siding, adu_shingle_gable]
      note: "Body and gable move together — the gable is painted cedar shingle, same colour."
      options:
        - {id: sandstone, label: Sandstone, value: [0.788, 0.724, 0.649], default: true,
           source: "sampled from video 7:50"}
        - {id: cloud,     label: Cloud,     value: [0.780, 0.790, 0.795]}
        - {id: sage,      label: Sage,      value: [0.400, 0.440, 0.360]}
        - {id: charcoal,  label: Charcoal,  value: [0.150, 0.155, 0.160]}
    - id: roof_colour
      label: Roof colour
      targets: [adu_roof]
      options:
        - {id: weathered, label: Weathered grey, value: [0.234, 0.251, 0.266], default: true,
           source: "sampled from video 6:56"}
        - {id: charcoal,  label: Charcoal,      value: [0.110, 0.115, 0.120]}
        - {id: driftwood, label: Driftwood,     value: [0.230, 0.190, 0.150]}
    - id: trim_colour
      label: Trim
      targets: [adu_trim, adu_post, adu_soffit]
      options:
        - {id: white,  label: White,  value: [0.850, 0.850, 0.850], default: true}
        - {id: almond, label: Almond, value: [0.820, 0.780, 0.700]}
    - id: main_flooring
      label: Main flooring
      targets: [adu_floor_oak]
      options:
        - {id: natural_oak, label: Natural oak, value: [0.480, 0.360, 0.220], default: true,
           source: "transcript 0:31 — white oak"}
        - {id: light_oak,   label: Light oak,   value: [0.600, 0.480, 0.330]}
        - {id: walnut,      label: Walnut,      value: [0.230, 0.150, 0.090]}
    - id: bath_flooring
      label: Bath flooring
      targets: [adu_slate_bath]
      options:
        - {id: slate,     label: Slate,     value: [0.100, 0.108, 0.118], default: true,
           source: "transcript 1:17"}
        - {id: limestone, label: Limestone, value: [0.520, 0.500, 0.460]}
    - id: cabinet_finish
      label: Cabinets
      targets: [adu_cab_wood]
      note: "Kitchen casework and the bath vanity move together — one material, as built."
      options:
        - {id: natural, label: Natural wood, value: [0.430, 0.290, 0.160], default: true,
           source: "video 1:08, 2:14, 2:40 — all show natural-wood shaker"}
        - {id: white,    label: White shaker,  value: [0.780, 0.775, 0.760]}
        - {id: espresso, label: Espresso,      value: [0.130, 0.095, 0.070]}
    - id: countertop
      label: Countertop
      targets: [adu_counter_stone]
      note: >
        The first two options are the two ACTUAL filmed units — see
        video_sources. The video showing different stone in different buildings
        is exactly why this is a choice rather than a fact, so both ship.
      options:
        - {id: white_granite, label: White granite, value: [0.560, 0.540, 0.510], default: true,
           source: "video 2:40 — the white/grey unit"}
        - {id: tan_granite,   label: Tan granite,   value: [0.520, 0.450, 0.360],
           source: "video 1:13 and 2:14 — the tan/beige unit"}
        - {id: charcoal,      label: Charcoal quartz, value: [0.140, 0.140, 0.145]}
    - id: sconce_finish
      label: Exterior light finish
      targets: [adu_fixture_galv]
      note: >
        The as-built fixture is galvanized (SHOPPING-GUIDE.pdf p9), so that is
        the default. The other two are the finishes the same fixture family is
        stocked in, and they cost nothing: fixture_galv carries no texture map,
        so its colour IS its base colour and a swap is three floats. Matte black
        is what the competitor configurators default to.
      options:
        - {id: galvanized, label: Galvanized, value: [0.340, 0.352, 0.362], default: true,
           source: "SHOPPING-GUIDE.pdf p9 — Westinghouse Galvanized Steel Finish"}
        - {id: matte_black, label: Matte black, value: [0.030, 0.031, 0.033]}
        - {id: bronze,      label: Oil-rubbed bronze, value: [0.062, 0.048, 0.038]}
  not_yet:
    - "Roof MATERIAL (metal vs shingle) — a colour swap cannot do it; needs a second texture."
    - "Styles and floor-plan variants — those are geometry, not materials."

# ---------------------------------------------------------------------------
textures:
  dir: textures/
  budget_kb: {lod0: 4096, lod1: 1536, lod2: 200}
  untextured_levels: [lod2]
  untextured_reason: >
    lod2 is the placement developer's model — viewed at 20-100 ft, plausibly
    several instances at once on a phone. Texturing took it from 17 KB to
    239 KB, past its own ceiling. It ships flat-shaded with base colours only;
    at that distance the maps buy nothing.
  generated_by: make_textures.py
  licence: "Procedurally generated here. No third-party assets, no licensing exposure."
  note: >
    Base colours come from materials.library, so the hue sampled from the video
    in P4 carries through. Low-frequency noise only: per-pixel noise is
    invisible at these contrasts and cost 2.4 MB across three maps before it
    was replaced, for a 13x saving.

# ---------------------------------------------------------------------------
video_sources:
  # READ THIS BEFORE SAMPLING ANY FINISH FROM THE VIDEO.
  file: "Affordable Housing Option. ADU Tour (w free plans).mp4"
  duration: "8:31"
  finding: >
    THE VIDEO INTERCUTS AT LEAST TWO DIFFERENT BUILT UNITS of the same floor
    plan. The kitchen chapter alone cuts between them 26 seconds apart: at 2:14
    the countertop is tan/beige granite and the refrigerator is white; at 2:40
    the countertop is white/grey granite and the refrigerator is stainless.
    Granite is not swapped between takes, so these are different buildings, not
    the same room restaged.
  consequence: >
    A finish sampled from the video describes ONE of those units, not "the"
    unit, and two finishes sampled from different timestamps may not belong
    together. Every finish citation must carry its timestamp — the existing ones
    do — and a finish must never be averaged across timestamps.
  what_is_safe: >
    CASEWORK IS CONSISTENT ACROSS BOTH UNITS and can be trusted: shaker doors,
    natural wood, upper cabinets present, an under-cabinet range hood, a sink
    base with doors, a four-drawer stack to its right, and the dishwasher at the
    south end. Both units also agree with the A1.1 appliance ORDER, which is an
    independent check on the Tier 3 footprint datum — see fixtures.measurement.
  exteriors_checked: >
    The exterior citations were re-checked against 0:00, 6:56 and 7:50 and are
    consistent with each other: warm off-white lap siding, grey composition
    roof, white trim. materials.provenance stands. (Note the stored values are
    LINEAR — siding 0.788/0.724/0.649 is sRGB ~232/224/212, a warm off-white,
    not the tan those linear figures suggest at a glance.)
  earlier_caution: >
    A weaker form of this was already recorded: a "siding" colour patch once
    turned out to be the pollinator garden, and an outdoor concrete-countertop
    pour was flagged as possibly a different project. The pour at 2:16-2:20 does
    resemble the 2:40 counter, but that is not established and should not be
    relied on.
  resolved:
    - id: range-fuel
      note: >
        SETTLED — all-electric, per the A1.1 ELEC RANGE label and the owner's
        decision. Video frames suggesting raised burner grates were a
        low-confidence read of one of the two units and are not a reason to
        depart from the plan. All-electric is also the internally consistent
        reading: the unit has a tankless ELECTRIC water heater and a heat pump.
  open: []

# ---------------------------------------------------------------------------
fixtures:
  # TIER 3. Kitchen casework, appliances and bath fixtures.
  #
  # FOOTPRINTS ARE MEASURED; HEIGHTS ARE NOT. The plan set contains no interior
  # elevations at all — sheets A0.0, A0.1, A1.0, A1.1, A2.0, A3.0, A4.0 and N-1,
  # and not one shows a vertical interior surface. So every `h:` and `z:` below
  # is an industry standard, marked `confidence: assumed`, and none of them
  # should be quoted back as though it came off the drawings.
  #
  # Footprints were measured on A1.1 (pdf page 3) rasterised at 200 dpi, where
  # 1/4"=1'-0" is exactly 50.0 px/ft — the same technique and the same scale the
  # exterior openings were measured at.
  measurement:
    dpi: 200
    px_per_ft: 50.0
    calibration: >
      Anchored on the INTERIOR wall faces, not the drawn wall band. The band
      measures 29 px (~7") where the wall is 5-1/2": the same line-weight
      inflation that made the exterior wall read 6-1/2" before P4 corrected it.
      Interior faces are also what fixtures physically sit against.
      Check: interior north face (row 559) to interior south face (row 1713.5)
      is 1154.5 px for an interior depth of 23'-1", i.e. 50.01 px/ft against a
      theoretical 50.0. The interior east face then lands within 0.006 ft of its
      expected 21'-6-1/2". Both interior dimensions reproduce to 1/8".
    method: >
      Fixture edges were taken from the DRAWN LINES — rows and columns whose ink
      spans most of the fixture — not from ink bounding boxes inside hand-chosen
      windows. Bounding boxes were tried first and abandoned: a window that
      clips its fixture reports the window, a window inside the fixture reports
      the window too, and nothing in the output distinguishes either from a real
      measurement. Six of nine fixtures were wrong that way before the method
      changed.
    tolerance_in: 1.0
  datum: "x from the interior WEST face; y measured SOUTH from the interior NORTH face — the same datum as interior_partitions.layout"
  # x,y = the fixture's north-west corner in that datum. w = extent in x (depth
  # off the west wall, for the wall runs). d = extent in y (length along it).
  kitchen:
    # A continuous run down the interior west wall. The cabinet front is a
    # single line at x = 2.00 ft: a 24" base cabinet, exactly stock. The
    # refrigerator and range project past it, which is how real kitchens draw.
    cabinet_run_depth:
      ft: 2.0
      raw: "2'-0\""
      confidence: measured
      measured: "front edge at col 534 for the sink base and the dishwasher"
      corroboration: >
        The BATH vanity, which is a separate fixture in a different room, has its
        front on the same col 534 — so 24" is the depth throughout, not a kitchen
        coincidence. Named here as corroboration only; the vanity itself is under
        fixtures.bath, not part of this run.
    counter_h:   {ft: 3.0,   raw: "3'-0\"",  source: "industry standard 36\" counter", confidence: assumed}
    counter_thk: {ft: 0.125, raw: "1-1/2\"", source: "industry standard", confidence: assumed}
    toe_kick_h:  {ft: 0.292, raw: "3-1/2\"", source: "industry standard", confidence: assumed}
    upper_cab:
      exists: true
      clear_above_counter: {ft: 1.5, raw: "1'-6\"", source: "industry standard 18\"", confidence: assumed}
      height:
        ft: 3.0
        raw: "3'-0\""
        confidence: assumed
        source: "industry standard 36\" — NOT the 30\" first assumed here"
        reasoning: >
          Video 1:08 gives a near-straight-on view of the whole run, and the
          upper cabinet tops sit clearly ABOVE the 7'-0" window head. That rules
          out a 30" upper, which would top out at exactly 84" (36" counter +
          18" clear + 30") and sit level with the head. A 36" upper reaches 90",
          leaving 6" to the 8'-0" flat ceiling in this zone, which matches the
          gap in frame.
          This is a QUALITATIVE constraint from the video, not a measurement.
          The footage is wide-angle and radially distorted, so pixel
          photogrammetry on it is not trustworthy at this precision — it can
          rule a value out without establishing one.
      depth: {ft: 1.0, raw: "1'-0\"", source: "industry standard 12\"", confidence: assumed}
      note: >
        NOT DRAWN on A1.1 — uppers do not appear in plan at all. Their EXISTENCE
        is now confirmed (video 1:08, 2:14 and 2:40, consistent across both
        units), but every dimension here remains an assumption.
    backsplash:
      height:
        ft: 0.5
        raw: "6\""
        confidence: derived
        source: >
          NOT assumed — arithmetic on two knowns. The W-KITCHEN sill is a
          MEASURED 3'-6" above finished floor and a 36" counter leaves exactly
          6" beneath it. Video 1:13 shows the granite backsplash running up to
          meet the window sill, which closes the loop.
      material: "same granite slab as the counter, not tile"
      source: "video 1:13 close-up, 1:08 wide"
    range_hood:
      exists: true
      type: under_cabinet
      note: >
        Stainless under-cabinet hood over the range, with a cabinet above it.
        On NEITHER the plan nor the original Tier 3 scope, and consistent across
        both video units.
      source: "video 1:08, 2:14, 2:40"
    runs:
      # The casework itself, in the fixtures datum (y measured SOUTH from the
      # interior north face). These are NOT independent measurements: the base
      # segments are exactly the gaps LEFT OVER between the measured appliances
      # and the interior south wall, so they inherit those measurements and add
      # nothing. That is why they are `derived` and not `measured`.
      #
      # The gaps land where the video says cabinets are, which is the check:
      #   10.710..12.370  19.9"  base cabinet between refrigerator and range
      #   14.880..16.640  21.1"  the four-drawer stack (video 1:08, 2:40)
      #   21.650..23.083  17.2"  base cabinet at the south end, past the D.W.
      base:
        - {id: base_mid, y0: 10.710, y1: 12.370, front: doors,     confidence: derived}
        - {id: drawers,  y0: 14.880, y1: 16.640, front: drawers_4, confidence: derived,
           source: "video 1:08 and 2:40 both show a four-drawer stack in exactly this gap"}
        - {id: sink_base, y0: 16.640, y1: 19.440, front: doors,    confidence: derived,
           source: "the measured sink_cabinet footprint; video shows two doors"}
        - {id: base_south, y0: 21.650, y1: 23.083, front: doors,   confidence: derived}
      counter:
        # Broken by the slide-in range, which lands on the floor between them.
        - {y0: 10.710, y1: 12.370}
        - {y0: 14.880, y1: 23.083}
      sink_cutout:
        # The opening in the countertop. MEASURED off the bowl drawn on A1.1,
        # not a stock assumption: the sheet draws the sink as an outer rim and
        # an inner bowl, and this is the INNER bowl, which is the actual hole.
        # The rim spans very nearly the whole 33" cabinet, so using it would
        # have cut away the counter's own bearing.
        x0: 0.400
        x1: 1.670
        y0: 16.940
        y1: 19.280
