      loft: >
        EMPTY IN EVERY SHOT of the tour video — carpet and guardrail only,
        consistent with A1.1 labelling it STORAGE. Deliberately not furnished.
      bathroom: >
        The video dresses it with a shower curtain, a plant and a towel. Those
        are styling, not furniture, and none of them is modelled.

  prefixes:
    # Plumbing fixtures SUPPLIED WITH THE UNIT. Deliberately not Furn_/Appl_,
    # which are shown-but-not-included and toggle off together — a toilet is
    # part of what the buyer gets, and must not disappear with the staging.
    plumbing: "Fix_"

  appliance_form:
    # All three are BOXES WITH DOOR LINES, which is what the plan predicted
    # when it said to test the appliances before reaching for a licensing
    # decision. Confirmed in the video:
    #   refrigerator  2:27, 2:29 — apartment-style top-freezer, one door line
    #   range         2:33, 2:37 — slide-in, cooktop flush with the counter,
    #                              black glass oven door, stainless handle bar
    #   dishwasher    2:21, 2:25 — flat panel with a recessed handle strip
    #
    # Footprints are MEASURED (Tier 3a). Everything below is stock proportion,
    # marked assumed, and none of it needs a third-party asset.
    panel_proud: {ft: 0.042, raw: "1/2\"", confidence: assumed,
                  note: "how far a door stands off its body"}
    door_gap:    {ft: 0.021, raw: "1/4\"", confidence: assumed}
    refrigerator:
      freezer_share: {fraction: 0.34, confidence: assumed,
                      source: "video 2:29 — top-freezer, split about a third down"}
    range:
      cooktop_thk: {ft: 0.06,  raw: "3/4\"",   confidence: assumed}
      control_h:   {ft: 0.17,  raw: "2\"",     confidence: assumed,
                    note: "front control strip, below the cooktop lip"}
      door_bottom: {ft: 0.33,  raw: "4\"",     confidence: assumed,
                    note: "storage drawer below the oven door"}
      handle_h:    {ft: 0.12,  raw: "1-1/2\"", confidence: assumed}
      handle_proud: {ft: 0.06,  raw: "3/4\"",   confidence: assumed}
    dishwasher:
      handle_h:    {ft: 0.15,  raw: "1-3/4\"", confidence: assumed}
    stacked_wd:
      # Found by verify_geometry.py on its very first run, alongside the
      # tub/shower: measured in Tier 3a and never built. Same failure, same
      # cause — it was on nobody's list.
      #
      # Fronts face EAST: the closet is entered through D-CLOSET in
      # P_bedroom_W, a north-south wall at x_int 8.86, so the bedroom side is
      # east of the unit.
      split_share: {fraction: 0.5, confidence: assumed,
                    note: "washer below, dryer above, roughly equal on a stack"}
      source: "A1.1 box labelled STACK W/D; visible at video 2:29"
    finish_note: >
      The two filmed units DIFFER — white at 2:11, stainless at 2:27 — so the
      appliance finish is a configurator choice, not a fact, exactly like the
      countertop and the taps. Modelled stainless as the default, with the
      bodies and fronts on one material so a variant set can drive them later.
    disclosure: >
      Appliances are SHOWN BUT NOT INCLUDED (TIER-3 §4), which is why they take
      the declared Appl_ prefix and toggle with the furniture.
  tub_form:
    # One-piece alcove tub/shower, confirmed at video 3:03-3:21: a white
    # surround of three walls with a moulded shelf, a rolled rim, a shower head
    # and valve on the end wall, and a curtain rod across the open front.
    #
    # Footprint MEASURED in Tier 3a and reproducing its callout better than
    # almost anything in the spec — 5'-0" exactly on the long axis, 1/2" on the
    # short. Heights below are stock and marked assumed, as everywhere else.
    #
    # WHY THIS WAS MISSED: §2 originally put "tub/shower" on the BUY side under
    # "Plumbing". Correcting the split from by-trade to by-shape moved it to
    # BUILD, and the basin was then built and the tub was not. Every close-out
    # after that said the buy list was "the toilet and the appliances" — so the
    # tub was neither bought nor built and fell out of both lists. A gate now
    # asserts that every measured fixture has geometry.
    surround:
      height:    {ft: 6.0,   raw: "6'-0\"",  confidence: assumed}
      thickness: {ft: 0.083, raw: "1\"",     confidence: assumed}
      shelf:
        height: {ft: 3.0,  raw: "3'-0\"",     confidence: assumed}
        depth:  {ft: 0.33, raw: "4\"",        confidence: assumed}
        width:  {ft: 1.25, raw: "1'-3\"",     confidence: assumed}
        source: "video 3:09 — moulded shelf in the back wall, left of centre"
    basin:
      floor: {ft: 0.17,  raw: "2\"",     confidence: assumed}
      inset:
        ft: 0.17
        raw: "2\""
        confidence: assumed
        note: >
          Rolled rim: the basin is inset from the unit's outer face, and this
          doubles as the apron thickness. A separate `wall` entry was here and
          unused — a dead spec value is worse than a dead local, because it
          implies a dimension is in play when nothing reads it.
    fittings:
      rod_h:    {ft: 6.0,   raw: "6'-0\"",   confidence: assumed}
      rod_r:    {ft: 0.042, raw: "1/2\"",    confidence: assumed}
      head_h:   {ft: 5.75,  raw: "5'-9\"",   confidence: assumed}
      valve_h:  {ft: 3.5,   raw: "3'-6\"",   confidence: assumed}
      spout_h:  {ft: 2.17,  raw: "2'-2\"",   confidence: assumed}
      fitting_r: {ft: 0.06, raw: "3/4\"",    confidence: assumed}
      source: "video 3:09, 3:18 — head high on the end wall, valve and spout below it"
    open_side: south
    note: >
      The alcove is closed on north, west and east; the open side faces south
      into the room, which is where the curtain rod runs. That follows from the
      measured footprint sitting against three walls, not from a choice.
  toilet_form:
    # Two-piece floor-mount, confirmed at video 2:51 — the only clear frame of
    # it in the tour (2:35-3:25 otherwise shows it cropped or occluded).
    #
    # That frame's job is only to establish the TYPE. The footprint is measured
    # (2'-5-3/4" projection x 1'-10-1/8" wide) and the heights are standard, so
    # once you know it is an ordinary two-piece the remaining form is stock.
    # This is why thin footage was not the binding constraint.
    tank:
      depth:  {ft: 0.63,  raw: "7-1/2\"",      confidence: assumed}
      width:  {ft: 1.67,  raw: "1'-8\"",       confidence: assumed}
      bottom: {ft: 1.19,  raw: "1'-2-1/4\"",   confidence: assumed}
    bowl:
      half_width: {ft: 0.58, raw: "6-15/16\"", confidence: assumed,
                   note: "An elongated bowl is ~14\" across — narrower than the 22\" tank, which is what the measured ink bbox actually caught."}
      foot_scale: {factor: 0.42, confidence: assumed}
      foot_setback: {ft: 0.15, raw: "1-3/4\"", confidence: assumed,
                     note: "Foot sits behind the bowl centre, as a real pedestal does."}
      tank_overlap: {ft: 0.09, raw: "1-1/8\"", confidence: assumed,
                     note: "How far the bowl's rear reaches back INSIDE the tank face, so the two read as one piece rather than meeting exactly."}
    riser:
      # The rear pedestal a two-piece bowl rises into, and the shelf the tank
      # actually bolts onto. Without it the tank FLOATS: the bowl is an
      # ellipse, so its rear tapers to almost nothing and met the tank across
      # three vertices. Every gate passed and the render showed a shelf stuck
      # to the wall.
      #
      # Dimensions are derived from the tank and the seat height rather than
      # invented — it is the tank's own footprint carried down to the floor.
      inset: {ft: 0.06, raw: "3/4\"", confidence: assumed,
              note: "narrower than the tank on each side, so the tank reads as sitting ON it"}
      confidence: derived
    lid:
      thickness: {ft: 0.042, raw: "1/2\"", confidence: assumed}
      rise:
        ft: 0.021
        raw: "1/4\""
        confidence: assumed
        note: >
          The lid sits this far PROUD of the rim, standing in for the seat ring
          between them. Not cosmetic: starting the lid exactly at the rim put
          its capped underside coplanar with the bowl's capped top — identical
          centre, identical area, opposite normals — which z-fights in any
          renderer.
    schematic_note: >
      Loft rings give a good silhouette and no rim detail, no bolt caps, no
      trapway moulding. That is the right trade at configurator distance and is
      consistent with the basin and taps already shipped. If photoreal
      sanitaryware is ever wanted, a CC0 asset is genuinely better — that is a
      fidelity decision, not a capability one.
    source: "footprint A1.1 (measured); type video 2:51; proportions industry standard"

# ---------------------------------------------------------------------------
texturing:
  # DECIDED 2026-09-06, per docs/TIER-2-materials-and-textures.md §2. Fixed
  # before Tier 1 geometry because it constrains how everything is authored.
  texel_density_px_per_ft: 128
  projection: cube            # all geometry here is box-like
  tile_size_px: 1024
  uv_channel: 0
  rationale: >
    The tightest detail that must read crisply is the 6" lap siding exposure.
    At 128 px/ft that is 64 px per course — sharp at the 2-6 ft distance a
    walkthrough implies, and still legible at configurator orbit distance.
  tolerance_pct: 15           # verification gate: per-object px/ft within +/-15%

# ---------------------------------------------------------------------------
ceilings:
  # Tier 1. The plan tags ceiling conditions room by room; vaulted zones are
  # derived from the roof underside functions in build_adu.py rather than
  # re-derived, so they cannot drift from the roof.
  thickness: {ft: 0.0417, raw: "1/2\"", note: "gypsum board, hung below the plate"}
  zones:
    - id: C_flat_under_loft
      type: flat
      height_ft: 8.0
      raw: "8'-0\""
      covers: "bath, bedroom, closet zone and the strip beneath the loft floor"
      source: "A1.1 tags 8'-0\" CEILING in both BATH and BEDROOM"
    - id: C_vault_living
      type: vaulted
      follows: main_roof_underside
      covers: "living / kitchen, south of the loft"
      source: "A1.1 tag VAULTED CEILING"
    - id: C_vault_loft
      type: vaulted
      follows: dormer_roof_underside
      covers: "loft storage"
      source: "A1.1 loft plan tag VAULTED CEILING"

# ---------------------------------------------------------------------------
floors:
  # Tier 1 delivers planes with a flat material slot each; Tier 2 textures them.
  finish_thickness: {ft: 0.0625, raw: "3/4\""}
  zones:
    - {id: F_main, material: floor_oak,  covers: "main floor except the bath", source: "transcript 0:31 — white oak"}
    - {id: F_bath, material: slate_bath, covers: "bath",                        source: "transcript 1:17 — slate"}
    - {id: F_loft, material: carpet_loft, covers: "loft storage",               source: "transcript 6:46 — heavy pad, light carpet"}

# ---------------------------------------------------------------------------
materials:
  provenance: >
    HUE and character are sampled from the video's exterior footage (frames at
    6:56 and 7:50, full resolution, patches visually confirmed before sampling —
    an earlier pick turned out to be the pollinator garden). LUMINANCE is NOT
    measured. A single uncontrolled frame cannot yield albedo: the siding patch
    sits in shade while the roof is in full sun, so their measured ratio (0.955)
    compares illumination, not reflectance, and the camera is auto-exposing.
    Levels below are therefore set to physically plausible albedos and the
    sampled hue applied on top. Swap in measured values if a controlled shot
    ever exists.
  sampled_hue_linear:
    siding_shaded: [0.521, 0.479, 0.429]   # warm — R > G > B
    roof_sunlit:   [0.468, 0.503, 0.533]   # cool — B > G > R
  library:
    siding:
      base_color_linear: [0.788, 0.724, 0.649]
      roughness: 0.80
      metallic: 0.0
      raw: "6\" LAP SIDING"
      neutral_albedo: true    # colour rides on baseColorFactor, so variants are free
      maps: {base_color: siding_albedo.png, normal: siding_normal.png}
      source: "A4.0 wall details; colour hue from video 6:56 / 7:50"
    shingle_gable:
      base_color_linear: [0.788, 0.724, 0.649]
      roughness: 0.88
      metallic: 0.0
      note: >
        A1.1 and A0.0 draw shingle coursing in the FRONT gable only — the rear gable
        is lap siding. In the video the gable reads the same body colour as the walls,
        consistent with painted cedar shingle. Same colour, higher roughness, kept as
        a separate slot so a shingle texture can be dropped in without touching the walls.
      neutral_albedo: true    # colour rides on baseColorFactor, so variants are free
      maps: {base_color: shingle_albedo.png, normal: shingle_normal.png}
      source: "A1.1 front elevation (coursing); video (colour)"
    roof:
      base_color_linear: [0.234, 0.251, 0.266]
      roughness: 0.90
      metallic: 0.0
      raw: "COMPOSITION ROOF"
      neutral_albedo: true    # colour rides on baseColorFactor, so variants are free
      maps: {base_color: roof_albedo.png, normal: roof_normal.png}
      source: "A4.0 roof details; hue from video 6:56. Light-mid grey, not charcoal."
    trim:
      base_color_linear: [0.850, 0.850, 0.850]
      roughness: 0.55
      metallic: 0.0
      source: "Video — window casing and fascia read brighter than the body colour."
    glass:
      base_color_linear: [0.055, 0.062, 0.070]
      roughness: 0.08
      metallic: 0.0
      transmission: 0.85
      source: "Generic architectural glazing; not measured."
    concrete:
      base_color_linear: [0.330, 0.325, 0.315]
      roughness: 0.92
      metallic: 0.0
      raw: "4\" CONC SLAB"
      maps: {base_color: concrete_albedo.png, roughness: concrete_roughness.png}
      source: "A2.0; video 1:25 'we just do basic concrete patios'."
    post:
      base_color_linear: [0.820, 0.820, 0.810]
      roughness: 0.60
      metallic: 0.0
      source: "Video 6:56 — porch posts read white, same family as the trim."
    floor_oak:
      base_color_linear: [0.480, 0.360, 0.220]
      roughness: 0.45
      metallic: 0.0
      neutral_albedo: true    # colour rides on baseColorFactor, so variants are free
      maps: {base_color: oak_albedo.png, normal: oak_normal.png}
      source: "transcript 0:31 'the same White Oak'; hue from video kitchen chapter 2:11"
      confidence: "hue from video, luminance plausible-not-measured — see provenance"
    slate_bath:
      base_color_linear: [0.100, 0.108, 0.118]
      roughness: 0.55
      metallic: 0.0
      neutral_albedo: true    # colour rides on baseColorFactor, so variants are free
      maps: {base_color: slate_albedo.png, normal: slate_normal.png}
      source: "transcript 1:17 'we use slate in the bathroom'"
      confidence: "luminance plausible-not-measured"
    carpet_loft:
      base_color_linear: [0.520, 0.500, 0.470]
      roughness: 0.95
      metallic: 0.0
      neutral_albedo: true    # colour rides on baseColorFactor, so variants are free
      maps: {base_color: carpet_albedo.png}
      source: "transcript 6:46 'a heavyduty pad and a nice light carpet'"
      confidence: "luminance plausible-not-measured"
    fir_ladder:
      base_color_linear: [0.540, 0.400, 0.240]
      roughness: 0.60
      metallic: 0.0
      source: "video 5:14 'clear vertical grain Douglas fir'; warmer and more saturated than the white oak floor"
      confidence: "luminance plausible-not-measured"
    drywall:
      base_color_linear: [0.800, 0.800, 0.790]
      roughness: 0.85
      metallic: 0.0
      source: "A4.0 wall details '1/2\" G.B.'; painted"
      no_maps_reason: >
        Deliberately untextured. A normal map for orange-peel relief cost
        1.36 MB and is invisible at any distance this model is viewed from.
        Flat colour is correct here, as it already is for trim.
    soil:
      # The crawlspace ground, seen through the crawl hole. Deliberately dull:
      # it exists so the opening reveals something rather than a void.
      base_color_linear: [0.115, 0.098, 0.082]
      roughness: 0.95
      metallic: 0.0
      source: "A4.0 details 1 and 3 — 6 mil vapor barrier over undisturbed native soil."
    soffit:
      base_color_linear: [0.800, 0.795, 0.780]
      roughness: 0.70
      metallic: 0.0
      source: "Porch ceiling, 8'-0\" — video."
    cab_wood:
      # Tier 3. Natural-wood shaker casework, consistent across BOTH video
      # units — see video_sources. Neutral albedo so the configurator's
      # reserved cabinet finish set costs no texture bytes.
      base_color_linear: [0.430, 0.290, 0.160]
      roughness: 0.42
      metallic: 0.0
      neutral_albedo: true
      maps: {base_color: "cabwood_albedo.png", normal: "cabwood_normal.png"}
      source: "video 1:08, 2:14, 2:40 — natural wood shaker, all three"
      confidence: "hue from video, luminance plausible-not-measured — see provenance"
    counter_stone:
      # Speckled granite. The two filmed units have DIFFERENT stone (tan/beige
      # at 2:14, white/grey at 2:40), which is precisely why this is a
      # configurator option rather than a fact — see variants.countertop.
      base_color_linear: [0.560, 0.540, 0.510]
      roughness: 0.22
      metallic: 0.0
      neutral_albedo: true
      maps: {base_color: "granite_albedo.png", normal: "granite_normal.png"}
      source: "video 1:13 close-up (tan unit), 2:40 wide (white/grey unit)"
      confidence: "hue from video; the two units differ, so the DEFAULT is a choice, not a measurement"
    porcelain:
      # Bath sanitaryware. Flat white is genuinely correct here, as it is for
      # trim — glazed porcelain has no pattern to carry.
      base_color_linear: [0.870, 0.870, 0.860]
      roughness: 0.15
      metallic: 0.0
      source: "video 2:52 — white sanitaryware, toilet and tub both"
    mirror:
      # A SCHEMATIC mirror: pale cool grey with a specular sheen, deliberately
      # NOT a real reflector.
      #
      # It shipped first as metallic 1.0 / roughness 0.02 — a true mirror — and
      # that is wrong for this model in a way that is not obvious. A perfect
      # metallic surface reflects whatever environment it is handed, and it
      # reflected the preview HDRI's foliage: green blotches, inside a
      # bathroom. That is not a viewport quirk to be waited out. A Three.js
      # configurator with an outdoor environment map does exactly the same
      # thing, and no reflection probe is guaranteed there.
      #
      # Reflecting the opposite wall would need a probe or screen-space
      # reflections — renderer features we cannot rely on in a web viewer, and
      # a heavy dependency for one 2'x2'6" panel.
      #
      # Metallic 0 means the environment contributes nothing but a highlight,
      # so the panel reads as a mirror by CONTEXT — framed, above a basin —
      # in every renderer, with no way for a garden to appear in it. This is
      # the same reasoning that keeps drywall flat: correct beats literal.
      base_color_linear: [0.720, 0.740, 0.775]
      roughness: 0.12
      metallic: 0.0
      source: "Bath mirror glass — video 3:03."
    fixture_galv:
      # Weathered hot-dip galvanized steel. The exterior sconce, and the first
      # material in this file whose SOURCE IS A DOCUMENT rather than a frame:
      # SHOPPING-GUIDE.pdf p9 names "Westinghouse Galvanized Steel Finish".
      #
      # HUE COULD NOT BE SAMPLED, AND THE ATTEMPT IS WORTH RECORDING. The shade
      # in shadow at video 1:37 samples linear [0.270, 0.194, 0.100], a hue of
      # 1 : 0.717 : 0.369. The cream siding six inches to its left samples
      # 1 : 0.723 : 0.367 — the same hue to three decimal places. That is not a
      # warm fixture, it is a grey fixture full of bounce off a cream wall in
      # late afternoon sun. The sunlit rim, which sees the sky instead, reads
      # 1 : 0.932 : 0.706 and is nearly neutral. Sampling the shaded patch would
      # have painted the sconce the colour of the siding and every render would
      # have looked subtly wrong with nothing to point at. Same failure mode as
      # the pollinator-garden patch in materials.provenance, caught earlier.
      #
      # So: near-neutral grey at a plausible albedo for weathered galvanizing,
      # a hair cool, and the document trusted over the frame.
      base_color_linear: [0.340, 0.352, 0.362]
      roughness: 0.55
      metallic: 0.35
      neutral_albedo: false
      source: "SHOPPING-GUIDE.pdf p9 WALL-MOUNTED LIGHTS; form confirmed at video 1:37"
      metallic_note: >
        Not metallic 0.9 like `steel`. That value is right for a stainless hood
        indoors under even light; on an exterior fixture with no reflection
        probe guaranteed in a web viewer, high metallic renders as a dark blob
        because there is nothing for it to reflect. 0.35 keeps a diffuse base
        that reads as galvanized in any renderer. Same reasoning as `mirror`:
        correct beats literal.
    lamp_glow:
      # The LOOK of a lit lamp, not a light source. A disc inside the shade
      # mouth, emissive. It illuminates nothing.
      #
      # Deliberately NOT KHR_lights_punctual. A real light is a viewer feature,
      # it is expensive to make look right, and it is not needed for the fixture
      # to read as switched on. Emission ships everywhere and costs one quad.
      # Day and night are then an emissive_factor swap at runtime, the same
      # trick the colour variants use.
      base_color_linear: [0.95, 0.88, 0.72]
      emissive_linear: [1.00, 0.86, 0.60]
      emissive_strength: 2.5
      roughness: 0.4
      metallic: 0.0
      source: "Warm 2700K lamp — the standard for an entry fixture. Not measured; the video is a daylight shot and the lamp is off in it."
    appliance_dark:
      # Cooktop and oven-door glass. Near-black and glossy, NOT the `glass`
      # material — that carries transmission and would render the oven door as
      # a window into the cabinet run.
      base_color_linear: [0.045, 0.047, 0.050]
      roughness: 0.15
      metallic: 0.0
      source: "video 2:33 — black glass cooktop and oven door."
    furn_fabric:
      base_color_linear: [0.36, 0.13, 0.09]
      roughness: 0.85
      metallic: 0.0
      source: "video 2:38-2:45 — rust upholstered sofa"
      confidence: "hue from video, luminance plausible-not-measured"
    furn_linen:
      base_color_linear: [0.72, 0.66, 0.58]
      roughness: 0.9
      metallic: 0.0
      source: "video 2:42 cushion, 4:13 bedding, 1:40 porch cushions — one warm off-white"
      confidence: assumed
    furn_wood:
      base_color_linear: [0.33, 0.21, 0.12]
      roughness: 0.5
      metallic: 0.0
      source: "video 1:40 teak porch chairs, 4:10 desk and ladder-back chair"
      confidence: assumed
    furn_metal:
      base_color_linear: [0.42, 0.31, 0.13]
      roughness: 0.3
      metallic: 0.9
      source: "video 4:10 brass floor lamp, 4:13 table lamp base"
      confidence: assumed
    furn_plant:
      base_color_linear: [0.09, 0.19, 0.08]
      roughness: 0.7
      metallic: 0.0
      source: "video 4:10 — monstera"
      confidence: assumed
    steel:
      base_color_linear: [0.560, 0.570, 0.580]
      roughness: 0.30
      metallic: 0.9
      source: "Stainless under-cabinet range hood — video 1:08, 2:14, 2:40."
  assignment:
    # object-name prefix -> material. First match wins.
    Wall_: siding
    Gable_N: siding
    Gable_S_porch: shingle_gable
    Dormer_face_: siding
    Dormer_cheek_: siding
    Roof_: roof
    Eave_band_: trim
    Loft_floor: trim
    Porch_post_: post
    Porch_ceiling: soffit
    Porch_slab: concrete
    Ceil_: drywall
    Trim_: trim
    Ladder_: fir_ladder
    Rail_: fir_ladder
    # The hatch is a flush panel in the main floor, so it takes the same oak.
    # It needs its own rule: "Floor_crawl_hatch" does not start with
    # "Floor_main", and an unmatched object fails the export gate.
    Floor_crawl_hatch: floor_oak
    Floor_main: floor_oak
    Floor_bath: slate_bath
    Floor_loft: carpet_loft
    # Furniture. One rule per (arrangement, material) pair, because assignment
    # matches a PREFIX and furniture objects are named arrangement-first --
    # the arrangement has to lead so #76 can hide one without hiding the rest.
    # Generated from fixtures.furniture.arrangements, so a new piece in a new
    # material fails the "every object matched a material" export gate rather
    # than silently shipping untextured.
    Furn_living_sofa_fabric: furn_fabric
    Furn_living_sofa_linen: furn_linen
    Furn_bedroom_bed_linen: furn_linen
    Furn_bedroom_bed_metal: furn_metal
    Furn_bedroom_bed_wood: furn_wood
    Furn_bedroom_office_linen: furn_linen
    Furn_bedroom_office_metal: furn_metal
    Furn_bedroom_office_plant: furn_plant
    Furn_bedroom_office_wood: furn_wood
    Furn_porch_chairs_linen: furn_linen
    Furn_porch_chairs_wood: furn_wood
    Found_rim: siding
    Found_pier: concrete
    Found_vent: appliance_dark
    Found_grade: soil
    Found_: concrete
    Floor_slab: concrete
    Part_: trim
    Glazing_: glass
    Door_: trim
    # Tier 3 casework. Longest prefix wins is NOT how `assignment` works —
    # first match wins — so Cab_top must precede Cab_.
    Cab_top: counter_stone
    Cab_splash: counter_stone
    Cab_hood: steel
    # Cab_basin_bath MUST precede Cab_basin: first match wins, and the bath
    # basin is glazed porcelain where the kitchen's is stainless.
    # Appl_dark must precede Appl_: first match wins.
    Appl_dark: appliance_dark
    Appl_: steel
    # Steel fittings must precede the porcelain Fix_tub catch-all.
    Fix_tub_rod: steel
    Fix_tub_head: steel
    Fix_tub_valve: steel
    Fix_tub: porcelain
    Fix_toilet: porcelain
    Cab_mirror_glass: mirror
    Cab_basin_bath: porcelain
    Cab_basin: steel
    Cab_faucet: steel
    Cab_: cab_wood
    # Mounted lighting. Light_lens must precede Light_: first match wins, and
    # the lens is the one emissive surface on an otherwise galvanized fixture.
    Light_lens: lamp_glow
    Light_: fixture_galv

# ---------------------------------------------------------------------------
foundation:
  # A2.0 draws TWO foundations. This model is the CRAWLSPACE variant — four
  # independent confirmations are recorded in
  # discrepancies.crawl-hole-implies-crawlspace-not-slab.
  variant: crawlspace
  stemwall:
    height:    {ft: 2.0,   raw: "2'-0\"", source: "A4.0 CROSS SECTION A/B - STEMWALL"}
    thickness: {ft: 0.667, raw: "8\"",    confidence: assumed}
    reading_note: >
      The 2'-0" ties a tick labelled BOTH "TOP OF FOUNDATION" and "TOP OF
      SUBFLOOR" down to "TOP OF FOOTING", so it is ambiguous whether it
      measures the foundation wall or the whole below-floor zone. Read here as
      the FOUNDATION WALL: at 2'-0" of wall the crawl has working height and
      the vents sit above grade, where the other reading leaves under 10" of
      stemwall and nowhere to put a vent. This is an INTERPRETATION, not a
      transcription, and is flagged as such.
  footing:
    depth: {ft: 0.667, raw: "8\"",    source: "A4.0 details 1 and 3, '8\" MIN'"}
    width: {ft: 1.333, raw: "1'-4\"", source: "A4.0 details 1 and 3, '1'-4\" MIN'"}
  floor_buildup:
    subfloor: {ft: 0.073, raw: "7/8\"",     source: "A4.0 detail 3, 7/8\" T&G SUB-FLOOR"}
    joist:    {ft: 0.99,  raw: "11-7/8\"",  source: "A2.0 MAIN FLOOR FRAMING, 11-7/8\" BCI"}
    mud_sill: {ft: 0.125, raw: "1-1/2\"",   source: "A4.0 detail 1, 2x6 PT MUD SILL"}
  grade:
    exposed_stemwall: {ft: 1.5, raw: "1'-6\"", confidence: assumed}
    note: >
      NOT A PLAN DIMENSION. A4.0's pony wall detail dimensions this zone as
      "VARIES WITH GRADE, 18" MIN" — the set deliberately declines to fix it,
      and docs/README already tells the placement developer that grade is
      theirs. 1'-6" of exposed stemwall is chosen FOR DEMONSTRATION and must
      never be read as measured. Nothing is BUILT from it: no LOD draws a
      ground plane, and it exists so verification can check the vents clear
      grade. The first value tried was 1'-0", which put the bottom of the vents
      EXACTLY on grade — the clearance gate passed only through its own
      tolerance. 1'-6" leaves 6" of stemwall below the vents, which is what a
      vent needs in order not to take water.
  venting:
    source: >
      A2.0 FOUNDATION PLAN DRAWS THE VENTS. They are the X-in-a-box symbols in
      the stemwall hatch, and they were MEASURED, not assumed: the sheet is
      1/4"=1'-0" rasterised at 200 dpi, and a vent reads as a run of pure-white
      columns across the grey concrete hatch.
    calibration: >
      Anchored on INTERIOR faces, because the drawn band is line-weight
      inflated the same way tools/tier3/frame.py documents for A1.1. Interior
      north face y=375 to interior south face y=1511 is 1136 px over
      24'-0" less two 8" stemwalls = 22'-8", giving 50.119 px/ft against the
      50.0 that 1/4"=1'-0" at 200 dpi must be. Cross-checks that did NOT feed
      the calibration: the east stemwall band measures 7.2" against its 8"
      callout, and the outer width measures 21.9' against 22'-0".
    width:
      ft: 1.333
      raw: "1'-4\""
      measured_as: >
        Every one of the eight boxes measures 17.2-17.5" as drawn. Read as a
        nominal 16" vent plus the same ~1" of line weight this set adds
        everywhere. The 1'-4" was ASSUMED before this measurement and is now
        CORROBORATED by it.
    height: {ft: 0.667, raw: "8\"", confidence: assumed}
    below_foundation: {ft: 0.333, raw: "4\"", confidence: assumed}
    recess: {ft: 0.083, raw: "1\"", confidence: assumed}
    height_note: >
      NEITHER THE HEIGHT NOR THE VERTICAL POSITION IS IN THE SET. A2.0 is a
      plan and cannot give them; A1.1's elevations draw NO vents at all and
      show only 5-3/4" of exposed concrete, which is schematic since an 8" vent
      does not fit in it. Both remain assumptions.
    openings:
      # Centres. x measured EAST from the west outer face; y measured SOUTH
      # from the north outer face. Each is the midpoint of a measured box, so
      # the nominal 1'-4" is centred on it rather than the inflated 17.2".
      - {wall: north, at: {ft: 7.04},  measured: "6.32..7.76 ft"}
      - {wall: north, at: {ft: 14.87}, measured: "14.15..15.58 ft"}
      - {wall: west,  at: {ft: 4.94},  measured: "4.22..5.66 ft"}
      - {wall: west,  at: {ft: 10.67}, measured: "9.94..11.40 ft"}
      - {wall: west,  at: {ft: 17.91}, measured: "17.19..18.62 ft"}
      - {wall: east,  at: {ft: 4.94},  measured: "4.22..5.66 ft"}
      - {wall: east,  at: {ft: 11.92}, measured: "11.20..12.64 ft"}
      - {wall: east,  at: {ft: 17.91}, measured: "17.19..18.62 ft"}
    south_wall_note: >
      THE SOUTH WALL HAS NONE, and that is drawn, not inferred. It is the wall
      behind the covered porch, so a vent there would breathe into the porch
      void rather than outdoors. An earlier version of this model put two vents
      on it.
    corner_rule_discrepancy: >
      THE DRAWN LAYOUT DOES NOT SATISFY A0.0'S OWN CORNER NOTE. A0.0 requires
      one opening within 3 feet of each corner; the nearest drawn vent to any
      corner is 4.22 ft, and the south wall has no vent at all. This is
      recorded, NOT corrected: the model reproduces what A2.0 draws. An earlier
      version of this spec invented a 2'-0" corner setback to satisfy the note
      and, in doing so, put vents where the plan does not have them.
    calculation: >
      Under-floor area is 486.7 sf (our own measured interior). Eight 16" x 8"
      vents are 7.11 sf GROSS. A0.0's unreduced rate, 1 per 150, needs 3.24 sf
      of NET FREE area, and a screened vent delivers roughly half its gross, so
      eight vents meet the unreduced rate with little to spare. THAT IS WHAT
      SETS THE COUNT. An earlier version of this spec claimed the corner rule
      governed and the vapor-retarder-reduced 1-per-1500 rate applied; the
      drawn count of eight is only explained by the unreduced rate.
  lod2_change: >
    Floor_slab was built into the PORCH collection, which finish_adu ships in
    EVERY level — so the wrong-variant slab was in lod2, the placement
    developer's model. Issue #69 claimed this fix was invisible to lod2 and was
    wrong. Per that conversation the stemwall replaces it IN lod2, so the
    siting model still has something at grade and now shows the building
    standing on a 2'-0" wall rather than flat on a slab. Footing, crawl grade
    and vents are lod0 only. THIS IS A HANDOFF CHANGE and was agreed, not
    slipped through.

# ---------------------------------------------------------------------------
lod:
  # Three.js THREE.LOD switch distances, in feet from the model origin.
  levels:
    - {name: lod0, contents: "shell + roof + porch + glazing + interior partitions", switch_ft: 0}
    - {name: lod1, contents: "shell + roof + porch + glazing; interior dropped", switch_ft: 60}
    - {name: lod2, contents: "massing only — no openings, no glazing, no interior", switch_ft: 160}
  export:
    format: glb
    compression: draco
    note: "Y-up, metres, +Z forward per glTF convention; Blender exporter converts from the Z-up foot-scaled scene."

# ---------------------------------------------------------------------------
areas_declared:
  main_floor_living_sf: {value: 528, source: "A1.1 'EXISTING S.F. NOTES'; A0.0 planning summary GHFA MAIN FLOOR"}
  upper_floor_storage_sf: {value: 264, source: "A1.1 'EXISTING S.F. NOTES'; A0.0 planning summary GHFA UPPER FLOOR"}
  total_living_sf: {value: 528, source: "A1.1 'EXISTING S.F. NOTES'"}
  ghfa_total_sf: {value: 792, source: "A0.0 planning summary"}
  proposed_building_footprint_sf: {value: 528, source: "A0.0 planning summary"}

# ---------------------------------------------------------------------------
discrepancies:
  - id: sconce-does-not-fit-under-the-modelled-soffit
    impact: >
      Measured straight off video 1:37 the sconce needs 8.02 ft from finished floor
      to the top of its arm: canopy centre 7.41, plus 0.60 of rise, plus the arm's
      own 0.03 radius. The modelled porch ceiling starts at 7.90 (plate 8.00 less a
      0.1 ft soffit, build_adu.py:563). The fixture therefore passed through the
      ceiling by 1.4", which verify_mounted.py failed it for.
    resolution: >
      THE FRAME AND THE PLAN DISAGREE BY LESS THAN THIS SPEC'S OWN TOLERANCE, so
      the fixture was moved rather than the ceiling.
      Checked first, because "shift it until the gate goes green" is how a model
      acquires a lie: the wall/soffit junction in the frame was measured directly,
      by scanning columns of clear wall either side of the fixture. It falls at
      px y=183, which is 7.97 ft — against the modelled 7.90. That is a 0.8"
      disagreement, inside the 2" tolerance this section declares, and the plan is
      the authority for the ceiling. So the frame is not evidence that the ceiling
      is wrong; it is evidence that the frame cannot resolve an inch.
      The fixture's INTERNAL proportions are the stronger measurement — its
      height-to-width ratio reproduces the product photo's to 0.3% — so those were
      kept intact and the whole assembly was dropped 1.9", to a canopy at 7.25.
      The arm now clears the soffit by 1/4".
    cost: >
      The shade rim lands at 6.87 where the frame reads 7.04, so the fixture sits
      2.1" lower than the single-frame measurement — a tenth of an inch outside
      the declared tolerance. That is the price of a rigid body that has to fit,
      and it is stated here rather than absorbed by quietly loosening the
      tolerance until it fits.
    what_would_settle_it: >
      Any frame showing the fixture and a known vertical dimension in the SAME
      part of the image — the door head is 4.7 ft away, across enough of a
      1280x720 action-camera frame for lens distortion to cost about an inch.
      Failing that, the manufacturer's dimensions: SHOPPING-GUIDE.pdf names the
      fixture but carries no spec sheet.
    not_done_here: >
      Chasing a better frame. The tour is 8:31 long and the porch appears in
      several shots; one of them may show the sconce beside something measurable.
      Nothing downstream depends on the answer to within 2".
  - id: crawl-hole-implies-crawlspace-not-slab
    status: RESOLVED — A2.0 read 2026-09-08; the question is answered, the fix is not yet made
    resolution: >
      A2.0 draws TWO foundation options, exactly as A1.0/A1.1 draw two roof
      options.

        FOUNDATION PLAN        — perimeter stem wall, a girder line on posts
                                 down the middle, 4" foundation drain, and the
                                 24" X 24" CRAWL HOLE. Slab appears ONLY in the
                                 6'-0" porch strip.
        FOUNDATION PLAN - SLAB — 4" CONC #4 on a 3' grid with a 16" x 1'-6"
                                 footing and 4" rigid insulation under. NO
                                 crawl hole anywhere on it.

      A2.0's MAIN FLOOR FRAMING plan settles which one this model follows: it
      shows 11-7/8" BCI joists at 24" o.c. over foundation bearing walls, with
      the crawl hole — i.e. the CRAWLSPACE option. A1.1, the Option B floor
      plan every dimension here comes from, carries that same crawl hole.

      So the crawl hole is right and the slab is wrong. `Floor_slab` spans the
      MAIN BODY (Y 6..30) using a thickness sourced from A2.0's porch callout,
      which belongs to neither the crawlspace option's main body nor anything
      else. The model is currently a mix of the two variants.
    fix_required: >
      Main body: no slab. It wants a crawlspace — stem walls at the perimeter,
      a centre girder on posts, and joists carrying the floor. Porch_slab
      (Y 0..6) is correct and stays. Whatever replaces Floor_slab must give the
      crawl hole something to look down at, or the opening reveals a void.
    not_done_here: >
      Reading A2.0 answered the question; changing the foundation is its own
      piece of work and touches geometry every other tier sits on.
    superseded_finding: >
      A1.1 calls out a 24" x 24" CRAWL HOLE in the main floor, which implies a
      crawl space beneath it. The model puts a slab under the whole footprint,
      and that slab's thickness is taken from A2.0's '4" CONC SLAB #4, 18"
      GRID' — a callout for the PORCH. Nothing in the spec establishes the main
      body's foundation type.
    impact: >
      Cutting the crawl hole makes this visible: the opening reveals the
      modelled slab, when a crawl hole exists precisely because there is a void
      to reach. Above the floor plane nothing is affected, so every gate and
      every elevation still holds.
    action: >
      Recorded, not guessed at. Resolving it means reading A2.0's foundation
      plan properly, which is its own piece of work. Do NOT quietly delete the
      slab under the main body to make the render look right — that would be
      inventing a foundation to suit a hole.
    surfaced_by: "cutting the crawl hole; the opening had to show something"
  - id: crawl-hole-under-closet-doors
    finding: >
      The 24"x24" crawl-space hatch sits entirely within the 6'-0" closet
      bypass door opening — a 2'-0" overlap. Both positions are MEASURED off
      A1.1, so this is the plan's own arrangement, not a modelling error.
    impact: >
      None geometrically: a door leaf passes over a floor hatch. It is awkward
      to use — you would be lifting the hatch in the closet threshold, under
      the door track — and worth raising with whoever owns the plan set rather
      than silently adjusting geometry to make it look tidier.
    action: "Recorded, not modelled around. The door-blocking gate skips floor openings for this reason."
    surfaced_by: "verify_fixtures.py gate 12, added after the bath door correction"
  # Built unit (video) vs published plans. Plans win for geometry; these are flagged
  # because they change what the model should show if the goal is the as-built unit.
  - id: dishwasher-width
    severity: low
    plan_says: "Dashed box labelled D.W., measured 2'-2-1/2\" (26.5\") wide on A1.1 at 200 dpi"
    stock_says: "24\" — the only width domestic dishwashers come in, bar an 18\" compact"
    analysis: >
      The drawn opening is 2-1/2" wider than any dishwasher that could occupy it.
      Most likely the box is the cabinet OPENING rather than the appliance, or a
      nominal gap was drawn. Every other appliance on this run reproduces a stock
      size closely — the range measures 30.1" against the video's "30 inch range" —
      so this is a local oddity and not a scale error.
    action: >
      Model the appliance at 24" inside the drawn opening. Do NOT snap the plan's
      number to 24": record it and leave the sheet alone, the same treatment the
      loft egress finding got.
    severity_note: "Cosmetic. It cannot fail a clearance check — the aisle is measured to the cabinet front, which is exact."
  - id: loft-egress-window
    severity: high
    plan_says: "4'-0\" x 2'-0\" X/O slider, two per dormer (A1.1 loft plan + left elevation)"
    video_says: >
      6:26 — "one thing that's hard to get in this small lofted space is an egress
      window; we've gone to the 3-0-3 casement window, and by being a full extension
      90-degree opening casement window we can meet egress requirements, which is
      5.7 square feet, no higher than 44 inches off the ground."
    analysis: >
      A 4'-0" x 2'-0" X/O slider has 8.0 sf gross but only ~4.0 sf net openable
      (one leaf), below the 5.7 sf egress minimum. A 3'-0" x 3'-0" casement gives
      ~9 sf gross and, at full 90-degree swing, meets 5.7 sf net. The built unit
      therefore departs from the published loft window schedule. The A1.1 loft plan
      even carries the "(18\" MIN-44\")" sill note next to that string.
    action: "Model the plan (4'-0\" x 2'-0\" X/O). Note the as-built alternative in P4 material/config notes."
  - id: bedroom-exterior-door
    severity: medium
    plan_says: "No exterior door shown on the bedroom's east wall. The 6'-0\" slider callout is the closet/laundry bypass door, on an interior wall."
    video_says: "4:16 — 'we have an egress window here, a door out to the pet yard'; 7:43 — 'a nice walkway over to the door leading out of the bedroom'"
    analysis: >
      The built unit has an exterior door from the bedroom to the rear yard. I could
      not find it on the A1.1 Option B plan at the resolution read. Either it is an
      as-built addition, or it is drawn on a wall segment I misread.
    resolved: true
    finding: >
      SETTLED — the published Option B set has NO exterior door on the bedroom's
      east wall, and no opening of any kind there. Confirmed by the A1.1 plan (solid
      wall, meter/panel outside), the RIGHT ELEVATION (unbroken lap siding at ground
      level), and an automated opening scan that found zero openings on that wall
      while correctly detecting all six on the other three walls. The pet-yard door
      seen in the video is an AS-BUILT ADDITION, not part of the free plan set.
    action: "Model the plans: solid east wall. Offer the door as a P4 configurator option if the as-built look is wanted."
  - id: closet-depth
    severity: low
    plan_says: "closet shown but depth not called out in the strings I could resolve"
    video_says: "4:20 — 'we do a full closet, this is 38 inches deep'"
    action: "Use 38\" if a dimension is needed; flag as video-sourced."
  - id: loft-usable-area
    severity: low
    plan_says: "264 sf upper floor storage (= 22.0 x 12.0)"
    video_says: "5:44 — 'we get about 200 ft of usable space up here'; 1:55 — 'about 150 square ft of storage' in the pull-down attic"
    analysis: "264 sf is the gross 22x12 dormered footprint; 21'-1\" x 11'-1\" clear = 234 sf; ~200 sf is the standing/usable subset. Not a conflict — three different measures."
    action: none

# ---------------------------------------------------------------------------
assumptions:
  height_datum:
    status: RESOLVED_IN_P3
    statement: "17'-9 11/16\" is measured MAIN FF -> TOP OF ROOF."
    resolution: >
      This entry used to assert the opposite — GRADE -> top of roof — and to call
      it "the one number to confirm". P3 confirmed it, the other way, and this
      block was never updated: it went on asserting the superseded reading in the
      same file that records the correction. Two places did (see
      envelope.bounding_box.z), which is how a corrected error gets re-adopted.
      Settled by overlaying the model on the A1.1 front elevation at 50 px/ft:
      the 4:12 dormer plane intercept agrees to 0.24" on the FF reading and is
      9-11/16" out on the grade reading. See discrepancies.height-datum.
    superseded_reasoning: >
      The original argument was that framing arithmetic gives FF -> ridge = 8.0 +
      0.75 + 8.25 = 17.00 ft, leaving a 0.807 ft (9-11/16") remainder that matches
      a normal stemwall grade-to-subfloor reveal. That remainder is roof assembly
      and heel, not a grade reveal — see levels.overall_height.
    impact: "None outstanding. Grade is not modelled at all; placement owns the grade-to-floor offset."
  compass:
    statement: "Porch/front assumed to face south; N/E/W assigned accordingly."
    reasoning: "The site plan (A0.1) is missing from the PDF, so true orientation is unknown. Wall IDs are self-consistent; remap if the site plan surfaces."
  rake_overhang:
    statement: "Rake overhang assumed equal to the 18\" eave overhang."
    reasoning: "A3.0 says '18\" OVERHANGS' without distinguishing eave from rake, and the elevations show a generous rake."
  porch_roof:
    statement: "Porch roof modeled as a continuation of the main 9:12 gable over the full 22' width."
    reasoning: "A1.1 right/left elevations show the roof running out over the porch posts with no break. Not separately dimensioned."
  front_door_size:
    statement: "3'-0\" x 6'-8\" assumed."
    reasoning: "Not resolved in the callouts at the resolution read. Standard size; low massing impact."

# ---------------------------------------------------------------------------
p4_export:
  verification: >
    Each .glb was parsed back out of its own bytes and, for the primary file,
    re-imported into a clean Blender session and rendered. Round-trip: 35 meshes,
    8 materials, bbox 7.62 x 10.06 x 5.53 m. Every baseColorFactor and roughness
    matches spec.materials.library exactly.
  files:
    - {name: barn_cabin_524_lod0.glb, kb: 29.3, meshes: 35, note: "shell + roof + porch + glazing + interior partitions with door openings"}
    - {name: barn_cabin_524_lod1.glb, kb: 26.2, meshes: 31, note: "interior partitions dropped"}
    - {name: barn_cabin_524_lod2.glb, kb: 17.0, meshes: 21, note: "massing only; openings not cut"}
    - {name: barn_cabin_524.glb, kb: 29.3, note: "primary deliverable, copy of lod0"}
  extensions: [KHR_draco_mesh_compression, KHR_materials_transmission]
  units: {scene_authored_in: feet, exported_in: metres, factor: 0.3048}
  bugs_found_and_fixed:
    - id: gltf-ignores-unit-scale
      finding: >
        The Blender glTF exporter writes raw Blender units as metres and ignores
        scene.unit_settings.scale_length. Setting scale_length alone produced a
        25 m wide building. Mesh data is now converted explicitly before export.
    - id: bbox-included-normals
      finding: >
        The first export check read every VEC3 accessor's min/max, which includes
        NORMAL (range -1..1) and inflated the measured bbox by up to 2 units per
        axis — it reported 18.14 where the model is 17.81. Now filtered to the
        POSITION accessors named by each primitive.
    - id: door-had-no-material
      finding: "The assignment map had no Door_ prefix, so the entry door exported untextured. Added."
  known_limitations:
    - "No UVs or textures. Flat PBR colours only; lap and shingle coursing is not represented."
    - "Closet / stacked-W-D walls and the loft ladder are still not modelled — see interior_partitions.layout.not_modelled."
    - "Trim, fascia, casing and gutters are not modelled — see the tier-3 list from P1."
    - "Glass uses KHR_materials_transmission. Confirm the Three.js material path supports it, or swap for an opaque dark pane."

