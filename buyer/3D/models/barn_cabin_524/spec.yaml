construction:
  # Assembly depths the builder needs. Kept here, not in build_adu.py, so the
  # script stays free of hardcoded dimensions.
  exterior_wall_thickness:
    ft: 0.4583
    raw: "5 1/2\""
    source: "A1.1 arithmetic: 22'-0\" body less the 21'-1\" loft clear width = 11\" total, 5 1/2\" per side. Bare 2x6 stud depth."
    superseded:
      ft: 0.542
      raw: "6 1/2\""
      why: >
        P2 measured the drawn wall band at 27 px and took it as 6 1/2". That reading
        includes the line weight of the wall edges, so it measured ink rather than
        wall. The 1" error made the interior 2" narrow and pushed the bedroom
        partition 4.3" off its dimension string. Same failure mode as the P3 rear
        datum: measure what the ink represents, not the ink.
    note: >
      The 22'-0" overall is to the outside of framing. Sheathing and siding sit
      outboard of it and are not modelled, so exterior dimensions are unaffected.
  interior_wall_thickness:
    ft: 0.2917
    raw: "3 1/2\""
    source: "Measured 3.6\" at the bedroom west partition (A1.1 @ 50 px/ft). 2x4 stud."
  roof_assembly_thickness:
    ft: 0.5
    raw: "6\""
    confidence: assumed
    note: "Rafter + 5/8\" sub-roof + felt + composition roofing. Not dimensioned on any sheet; affects silhouette thickness only."
  porch_post:
    ft: 0.5
    raw: "6x6"
    confidence: assumed
    note: "A2.0 concrete footing table permits 4x4, 4x6 or 6x6 on type B footings and requires 6x6 on type C. 6x6 chosen as the heavier, and the one the footing table mandates at the porch corners."
  porch_slab_thickness: {ft: 0.333, raw: "4\"", source: "A2.0 '4\" CONC SLAB #4, 18\" GRID'"}
  ceiling_thickness: {ft: 0.0417, raw: "1/2\"", source: "Tier 1; standard gypsum board"}
  floor_finish_thickness: {ft: 0.0625, raw: "3/4\"", source: "Tier 1; standard finish floor over subfloor"}
  dormer_window_sill_above_loft_floor:
    ft: 2.0
    confidence: derived
    note: >
      NOT measured — see openings.loft.sill_height. Derived by centring a 2'-0" window
      in the 4'-4" dormer face wall with the head 4" below the top plate. Gives a 24"
      sill, which clears the 44" egress sill maximum; the loft egress failure is one of
      net openable area, not sill height. Revisit in P3 against the left elevation.

