      NOT measured — see openings.loft.sill_height. Derived by centring a 2'-0" window
      in the 4'-4" dormer face wall with the head 4" below the top plate. Gives a 24"
      sill, which clears the 44" egress sill maximum; the loft egress failure is one of
      net openable area, not sill height. Revisit in P3 against the left elevation.

